                '<div class="song-header-main">',
                  '<h2>(Missing song)</h2>',
                  '<div class="song-detail-row song-header-detail-row"><p>slug: ' + (slug ? escapeHtml(slug) : '(unknown)') + '</p></div>',
                '</div>',
              '</div>',
              '<div class="sheet-stage" id="sheet-stage">',
                '<div class="cw-sheet"></div>',
              '</div>',
            '</div>',
          '</div>',
        '</div>'
      ].join('');
    },

    renderSetlistPlaybackBar: function() {
      const context = this.state.currentSetlist;
      if (!context || !Array.isArray(context.items) || !context.items.length) return '';
      const index = Math.max(0, Math.min(context.items.length - 1, parseInt(context.index, 10) || 0));
      const hasNext = index < context.items.length - 1;
      const nextItem = hasNext ? context.items[index + 1] : null;
      const nextSong = nextItem ? this.getSongSummaryBySlug(nextItem.slug) : null;
      const nextTitle = nextSong ? (nextSong.title || nextItem.slug || 'Untitled song') : '(Missing song)';
      const nextButtonLabel = hasNext
        ? '<span class="setlist-playbar-next-prefix">Next:</span><span class="setlist-playbar-next-title">' + escapeHtml(nextTitle) + '</span>'
        : 'End';
      return [
        '<div class="setlist-playbar">',
          '<button class="btn" type="button" data-app-action="setlist-back">← Back</button>',
          '<div class="setlist-playbar-title">' + escapeHtml(context.title || 'Untitled setlist') + '</div>',
          '<div class="setlist-playbar-controls">',
            '<button class="btn" type="button" data-app-action="setlist-prev"' + (index <= 0 ? ' disabled' : '') + '>Prev</button>',
            '<div class="setlist-playbar-count">' + (index + 1) + ' / ' + context.items.length + '</div>',
            '<button class="btn setlist-playbar-next" type="button" data-app-action="setlist-next"' + (!hasNext ? ' disabled' : '') + '>' + nextButtonLabel + '</button>',
          '</div>',
        '</div>'
      ].join('');
    },

    renderListPage: function() {
      const listHtml = this.renderVisibleSongListHtml();
      const actionButtons = this.state.dedupeMode
        ? '<button class="btn" data-app-action="toggle-dedupe">Cancel</button>'
        : [
            '<button class="btn primary setlists-entry-btn" data-app-action="show-setlists">Setlists</button>',
            '<button class="btn" data-app-action="sync-library-to-gas">Sync to GAS</button>',
            '<button class="btn" data-app-action="export-all-songs">Export all</button>',
            '<button class="btn" data-app-action="import-all-songs">Import</button>',
            '<button class="btn primary" data-app-action="open-editor">Add Song</button>',
          ].join('');

      return [
        '<div class="shell">',
          '<div class="topbar">',
            '<div class="title-block">',
              '<div class="title-row">',
                '<h1>Personal ChordPro Viewer</h1>',
                '<button class="maintenance-menu-button" type="button" data-app-action="show-maintenance-menu" title="Maintenance" aria-label="Maintenance"><span class="material-symbols-outlined" aria-hidden="true">settings</span></button>',
              '</div>',
            '</div>',
            '<div class="actions list-topbar-actions">',
              actionButtons,
            '</div>',
          '</div>',
          this.renderStatusHtml(),
          '<div class="panel pad">',
            '<div class="search-row">',
              '<input id="list-search-input" class="field" placeholder="Search title / artist / tags" value="' + escapeHtml(this.state.searchDraft) + '" data-app-input="search" data-app-keydown="search" data-app-composition="search">',
              '<button class="btn" data-app-action="clear-search">Clear</button>',
            '</div>',
            '<div class="song-list">' + listHtml + '</div>',
            '<input id="list-song-import-input" type="file" accept="application/json,.json" data-app-change="song-library-import" hidden>',
          '</div>',
          '<div class="list-help-link-wrap"><a class="list-help-link" href="manual.html" target="_blank" rel="noopener">使い方 / User Manual</a></div>',
        '</div>'
      ].join('');
    },

    escapeJs: function(text) {
      return String(text || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }
  };

  if (window.history && 'scrollRestoration' in window.history) {
    window.history.scrollRestoration = 'manual';
  }

  window.addEventListener('DOMContentLoaded', function() {
    window.scrollTo(0, 0);
    App.init();
  });

  window.addEventListener('popstate', function() {
    App.routeFromQuery(App.parseQueryFromLocation());
  });
</script>

  </body>
</html>
