  :root {
    --bg: #f5f7fb;
    --panel: #ffffff;
    --line: #d7dce5;
    --text: #1f2937;
    --muted: #667085;

    --btn-line: #d4dbe7;

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Inter, "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: #35506d;
    caret-color: auto;
  }
  button, input, textarea, select {
    font: inherit;
  }
  button {
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  label {
    -webkit-user-select: none;
    user-select: none;
  }
  .hidden { display: none !important; }
  .loading-screen {
    min-height: 100vh;
    display: grid;
    place-items: center;
    color: var(--muted);
  }
  .shell {
    max-width: 1500px;
    margin: 0 auto;
    padding: 20px;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: nowrap;
    min-width: 0;
  }
  .title-block {
    min-width: 0;
    flex: 1 1 auto;
  }
  .title-block h1 {
    margin: 0;
    font-size: 1.4rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .title-row h1 {
    flex: 0 1 auto;
    min-width: 0;
  }
  .maintenance-menu-button {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    min-width: 32px;
    min-height: 32px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    box-shadow: none;
    cursor: pointer;
  }
  .maintenance-menu-button:focus-visible {
    outline: none;
    color: var(--accent);
    box-shadow: var(--btn-focus-ring);
  }
  @media (hover: hover) and (pointer: fine) {
    .maintenance-menu-button:hover:not(:disabled) {
      color: var(--accent);
      box-shadow: var(--btn-hover-ring);
    }
  }
  .maintenance-menu-button .material-symbols-outlined {
    font-family: "Material Symbols Outlined";
    font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    font-size: 20px;
    line-height: 1;
  }
  .title-block p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .actions, .inline-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    min-width: 0;
  }
  .song-header .inline-actions {
    margin-bottom: 10px;
  }
  .song-header .song-header-actions {
    justify-content: flex-end;
    align-self: flex-start;
    margin-left: auto;
    margin-bottom: 0;
    flex: 0 0 auto;
  }
  #viewer-note-import-input {
    display: none;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid var(--btn-line);
    border-radius: 12px;
    background: var(--btn-bg);
    color: #334155;
    padding: 10px 14px;
    min-height: 40px;
    line-height: 1.15;
    font-size: 0.92rem;
    font-weight: 400;
    text-align: center;
    white-space: nowrap;
    box-shadow: var(--btn-shadow);
    transition: background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease, box-shadow 0.14s ease, transform 0.14s ease;
  }
  @media (hover: hover) and (pointer: fine) {
    .btn:hover:not(:disabled) {
      box-shadow: var(--btn-hover-ring);
    }

        videoId = extractYouTubeId(raw);
        var timeMatch = raw.match(/[?&](?:t|start)=([^&#]+)/i);
        if (timeMatch) start = parseYouTubeTime(timeMatch[1]);
      } else {
        var parts = raw.split(/[?&]/);
        videoId = parts[0].trim();
        for (var i = 1; i < parts.length; i++) {
          if (/^(t|start)=/.test(parts[i])) {
            start = parseYouTubeTime(parts[i].split('=')[1]);
            break;
          }
        }
      }
      videoId = String(videoId || '').trim();
      if (!isValidYouTubeVideoId(videoId)) {
        throw new Error('Invalid YouTube link or video ID: ' + raw);
      }
      return { id: videoId, start: Math.max(0, start || 0) };
    }

    function parseYouTubeInput(value) {
      return String(value || '')
        .split(/\n/)
        .filter(function(line) { return String(line || '').trim(); })
        .map(function(line) { return parseOneYouTubeLine(line); });
    }

    function extractTitleArtistFromChordPro(content) {
      var titleMatch = findChordProDirectiveValue(content, ['title', 't']);
      var subtitleMatch = findChordProDirectiveValue(content, ['subtitle', 'st']);
      return {
        title: titleMatch,
        artist: subtitleMatch
      };
    }

    function normalizeSongPayload(payload) {
      const source = payload || {};
      const title = String(source.title || '').trim();
      const artist = String(source.artist || '').trim();
      const chordPro = String(source.chordPro || '');
      const extracted = extractTitleArtistFromChordPro(chordPro);
      const finalTitle = title || extracted.title || '';
      const finalArtist = artist || extracted.artist || '';
      return {
        originalSlug: buildSlug(source.originalSlug || ''),
        slug: buildSlug(source.slug || finalTitle),
        title: finalTitle,
        artist: finalArtist,
        tags: Array.isArray(source.tags) ? source.tags.map(String) : parseTags(source.tags),
        youtube: Array.isArray(source.youtube) ? normalizeYouTubeSelection(source.youtube) : parseYouTubeInput(source.youtube),
        chordPro: chordPro,
        createdAt: String(source.createdAt || ''),
        updatedAt: String(source.updatedAt || ''),
        scrollStartPercent: Math.max(0, Math.min(1, parseFloat(source.scrollStartPercent))),
        scrollEndPercent: Math.max(0, Math.min(1, parseFloat(source.scrollEndPercent))),
        scrollDurationSec: Math.max(1, parseInt(source.scrollDurationSec, 10) || 240),
        transpose: normalizeStoredTranspose(source.transpose, 0),
        notation: normalizeStoredNotation(source.notation, 'default')
      };
    }

    function generateSetlistId() {
      return 'setlist-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    }

    function normalizeSetlistItems(items) {
      const source = Array.isArray(items) ? items : [];
      return source.map(function(item) {
        const slug = typeof item === 'string'
          ? String(item || '').trim()
          : String(item && item.slug || '').trim();
        if (!slug) return null;
        const itemId = typeof item === 'object' && item
          ? String(item.itemId || '').trim()
          : '';
        return {
          itemId: itemId || ('item-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8)),
          slug: slug
        };
      }).filter(Boolean);
    }

    function mergeNoteLists(primary, secondary) {
      const merged = [];
      const seen = Object.create(null);
      [primary, secondary].forEach(function(list) {
        (Array.isArray(list) ? list : []).forEach(function(note) {
          if (!note) return;
          const copy = cloneValue(note);
          const id = String(copy.id || '').trim();
          if (id) {
            if (seen[id]) return;
            seen[id] = true;
          }
          merged.push(copy);
        });
      });
      return merged;
    }

    function notesFromEntry(entry) {
      return entry && Array.isArray(entry.notes) ? cloneValue(entry.notes) : [];
    }

    function normalizeSetlistPayload(payload) {
      const source = payload || {};
      return {
        id: String(source.id || '').trim(),
        title: String(source.title || '').trim(),
        items: normalizeSetlistItems(source.items),
        createdAt: String(source.createdAt || ''),
        updatedAt: String(source.updatedAt || '')
      };
    }

    function validateSetlist(setlist) {
      if (!setlist.title) throw new Error('Setlist title is required.');
    }

    function validateSong(song) {
      if (!song.slug) {
        if (song.title) {
          throw new Error('Slug is required. For non-Latin titles, please enter a slug using lowercase letters, numbers, and hyphens.');
        }
        throw new Error('Slug is required.');
      }
      if (!song.title) throw new Error('Title is required.');
      if (!song.artist) throw new Error('Artist is required.');
      if (!song.chordPro || !song.chordPro.trim()) throw new Error('ChordPro is required.');
      if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(song.slug)) {
        throw new Error('Slug must contain only lowercase letters, numbers, and hyphens.');
      }
    }

    function normalizeYouTubeSelection(value) {
      var list = [];
      if (Array.isArray(value)) {
        list = value;
      } else if (value && typeof value === 'object') {
        list = [value];
      } else if (typeof value === 'string') {
        list = parseYouTubeInput(value);
      } else {
        return [];
      }
      return list.map(function(item) {
        var rawId = '';
        if (item && typeof item === 'object') {
          if (item.id && typeof item.id === 'object') {
            rawId = item.id.videoId || item.id.id || item.id.value || '';
          } else {
            rawId = item.id || item.videoId || item.youtubeId || item.url || '';
          }
        } else {
          rawId = item;
        }
        var id = extractYouTubeId(rawId);
        if (!id && typeof rawId === 'string') id = extractYouTubeId(rawId.split(/[?&]/)[0]);
        var rawStart = 0;
        if (typeof rawId === 'string') {
          var timeMatch = rawId.match(/[?&](?:t|start)=([^&#]+)/i);
          if (timeMatch) rawStart = parseYouTubeTime(timeMatch[1]);
        }
        var explicitStart = item && typeof item === 'object' ? item.start : null;
        var start = explicitStart == null || explicitStart === ''
          ? rawStart
          : Math.max(0, parseInt(explicitStart, 10) || 0);
        return {
          id: id,
          start: Math.max(0, start || 0)
        };
      }).filter(function(item) { return !!item.id; });
    }

    function extractYouTubeId(value) {
      if (value && typeof value === 'object') {
        value = value.videoId || value.id || value.value || '';
      }
      var text = String(value || '').trim();
      if (!text) return '';
      var match = text.match(/[?&]v=([A-Za-z0-9_-]{11})/);
      if (match) return match[1];
      match = text.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);
      if (match) return match[1];
      match = text.match(/embed\/([A-Za-z0-9_-]{11})/);
      if (match) return match[1];
      match = text.match(/shorts\/([A-Za-z0-9_-]{11})/);
      if (match) return match[1];
      match = text.match(/live\/([A-Za-z0-9_-]{11})/);
      if (match) return match[1];
      if (/^[A-Za-z0-9_-]{11}$/.test(text)) return text;
      return '';
    }

    const ChordProStorage = {
      _db: null,
      _readyPromise: null,
      _noteCache: Object.create(null),

      ready: function() {
        if (!this._readyPromise) {
          this._readyPromise = this._openAndWarm();
        }
        return this._readyPromise;
      },

      _openAndWarm: async function() {
        this._db = await this._openDb();
        await this._loadAllNotesIntoCache();
        return this._db;
      },

      _openDb: function() {
        return new Promise(function(resolve, reject) {
          if (!window.indexedDB) {
            reject(new Error('IndexedDB is not available in this browser.'));
            return;
          }
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = function(event) {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(SONGS_STORE)) {
              const songs = db.createObjectStore(SONGS_STORE, { keyPath: 'slug' });
              songs.createIndex('updatedAt', 'updatedAt', { unique: false });
              songs.createIndex('title', 'title', { unique: false });
            }
            if (!db.objectStoreNames.contains(NOTES_STORE)) {
              db.createObjectStore(NOTES_STORE, { keyPath: 'slug' });
            }
            if (!db.objectStoreNames.contains(SETLISTS_STORE)) {
              const setlists = db.createObjectStore(SETLISTS_STORE, { keyPath: 'id' });
              setlists.createIndex('updatedAt', 'updatedAt', { unique: false });
              setlists.createIndex('title', 'title', { unique: false });
            }
          };
          request.onsuccess = function() { resolve(request.result); };
          request.onerror = function() { reject(request.error || new Error('Failed to open IndexedDB.')); };
        });
      },

      _txStore: function(storeName, mode) {
        const tx = this._db.transaction(storeName, mode || 'readonly');
        return tx.objectStore(storeName);
      },

      _requestToPromise: function(request) {
        return new Promise(function(resolve, reject) {
          request.onsuccess = function() { resolve(request.result); };
          request.onerror = function() { reject(request.error || new Error('IndexedDB request failed.')); };
        });
      },

      _transactionToPromise: function(tx, message) {
        return new Promise(function(resolve, reject) {
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function() { reject(tx.error || new Error(message)); };
          tx.onabort = function() { reject(tx.error || new Error(message)); };
        });
      },

      _loadAllNotesIntoCache: async function() {
        this._noteCache = Object.create(null);
        const store = this._txStore(NOTES_STORE, 'readonly');
        const rows = await this._requestToPromise(store.getAll());
        (Array.isArray(rows) ? rows : []).forEach((entry) => {
          const slug = String(entry && entry.slug || '').trim();
          if (!slug) return;
          this._noteCache[slug] = Array.isArray(entry && entry.notes) ? cloneValue(entry.notes) : [];
        });
      },

      getAppConfig: async function() {
        await this.ready();
        return {
          appUrl: window.location.protocol === 'file:'
            ? String(window.location.href || '').split('#')[0].split('?')[0]
            : String(window.location.origin || '') + String(window.location.pathname || ''),
          fonts: cloneValue(DEFAULT_FONTS)
        };
      },

      listSongs: async function() {
        await this.ready();
        const store = this._txStore(SONGS_STORE, 'readonly');
        const rows = await this._requestToPromise(store.getAll());
        return (Array.isArray(rows) ? rows : [])
          .filter(function(song) { return !!(song && song.slug); })
          .map(function(song) {
            return {
              slug: song.slug,
              title: song.title,
              artist: song.artist,
              tags: Array.isArray(song.tags) ? cloneValue(song.tags) : [],
              updatedAt: song.updatedAt || '',
              createdAt: song.createdAt || ''
            };
          })
          .sort(function(a, b) {
            return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
          });
      },

      getSong: async function(slug) {
        await this.ready();
        const normalizedSlug = String(slug || '').trim();
        if (!normalizedSlug) return null;
        const store = this._txStore(SONGS_STORE, 'readonly');
        const found = await this._requestToPromise(store.get(normalizedSlug));
        return found ? cloneValue(found) : null;
      },

      getAllSongsFull: async function() {
        await this.ready();
        const store = this._txStore(SONGS_STORE, 'readonly');
        const rows = await this._requestToPromise(store.getAll());
        return (Array.isArray(rows) ? rows : [])
          .filter(function(song) { return !!(song && song.slug); })
          .map(function(song) {
            const record = cloneValue(song);
            record.scrollStartPercent = normalizeStoredPercent(record.scrollStartPercent, 0);
            record.scrollEndPercent = normalizeStoredPercent(record.scrollEndPercent, 1);
            record.scrollDurationSec = normalizeStoredDuration(record.scrollDurationSec, 240);
            record.transpose = normalizeStoredTranspose(record.transpose, 0);
            record.notation = normalizeStoredNotation(record.notation, 'default');
            return record;
          })
          .sort(function(a, b) {
            return String(a.slug || '').localeCompare(String(b.slug || ''));
          });
      },

      importSongs: async function(records) {
        await this.ready();
        const source = Array.isArray(records) ? records : [];
        const existingRows = await this._requestToPromise(this._txStore(SONGS_STORE, 'readonly').getAll());
        const existingBySlug = Object.create(null);
        (Array.isArray(existingRows) ? existingRows : []).forEach(function(record) {
          if (record && record.slug) existingBySlug[String(record.slug)] = record;
        });
        const seen = Object.create(null);
        const normalizedRecords = source.map(function(item) {
          const normalized = normalizeSongPayload(item || {});
          validateSong(normalized);
          if (seen[normalized.slug]) {
            throw new Error('Duplicate slug in import file: ' + normalized.slug);
          }
          seen[normalized.slug] = true;
          const existing = existingBySlug[normalized.slug] || null;
          const createdAt = String(item && item.createdAt || (existing && existing.createdAt) || normalized.createdAt || new Date().toISOString());
          const updatedAt = String(item && item.updatedAt || normalized.updatedAt || createdAt || new Date().toISOString());
          return {
            slug: normalized.slug,
            title: normalized.title,
            artist: normalized.artist,
            tags: Array.isArray(normalized.tags) ? cloneValue(normalized.tags) : [],
            youtube: Array.isArray(normalized.youtube) ? cloneValue(normalized.youtube) : [],
            chordPro: normalized.chordPro,
            createdAt: createdAt,
            updatedAt: updatedAt,
            scrollStartPercent: normalizeStoredPercent(normalized.scrollStartPercent, 0),
            scrollEndPercent: normalizeStoredPercent(normalized.scrollEndPercent, 1),
            scrollDurationSec: normalizeStoredDuration(normalized.scrollDurationSec, 240),
            transpose: normalizeStoredTranspose(normalized.transpose, 0),
            notation: normalizeStoredNotation(normalized.notation, 'default')
          };
        });
        const tx = this._db.transaction(SONGS_STORE, 'readwrite');
        const store = tx.objectStore(SONGS_STORE);
        normalizedRecords.forEach(function(record) {
          store.put(record);
        });
        await this._transactionToPromise(tx, 'Failed to import songs.');
        return { ok: true, count: normalizedRecords.length };
      },


      rebuildSlugsFromTitles: async function() {
        await this.ready();
        const tx = this._db.transaction([SONGS_STORE, SETLISTS_STORE, NOTES_STORE], 'readwrite');
        const songStore = tx.objectStore(SONGS_STORE);
        const setlistStore = tx.objectStore(SETLISTS_STORE);
        const notesStore = tx.objectStore(NOTES_STORE);
        const songs = await this._requestToPromise(songStore.getAll());
        const plan = buildUniqueSlugPlanForSongs(Array.isArray(songs) ? songs : []);
        const slugMap = Array.isArray(plan.slugMap) ? plan.slugMap : [];
        const slugMapByOldSlug = plan.slugMapByOldSlug || Object.create(null);
        if (!slugMap.length) {
          return {
            ok: true,
            count: Array.isArray(songs) ? songs.length : 0,
            changedCount: 0,
            setlistRefsUpdated: 0,
            notesUpdated: 0,
            slugMap: [],
            notesMigratedInStorage: true
          };
        }

        songStore.clear();
        (Array.isArray(plan.songs) ? plan.songs : []).forEach(function(record) {
          songStore.put(record);
        });

        const now = new Date().toISOString();
        const setlists = await this._requestToPromise(setlistStore.getAll());
        let setlistRefsUpdated = 0;
        (Array.isArray(setlists) ? setlists : []).forEach(function(setlist) {
          const items = normalizeSetlistItems(setlist && setlist.items);
          let changed = false;
          const nextItems = items.map(function(item) {
            const nextSlug = slugMapByOldSlug[item.slug];
            if (!nextSlug) return item;
            changed = true;
            setlistRefsUpdated += 1;
            return Object.assign({}, item, { slug: nextSlug });
          });
          if (changed) {
            setlistStore.put(Object.assign({}, setlist, { items: nextItems, updatedAt: now }));
          }
        });

        const noteEntries = await this._requestToPromise(notesStore.getAll());
        const nextNotesBySlug = Object.create(null);
        let notesUpdated = 0;
        (Array.isArray(noteEntries) ? noteEntries : []).forEach(function(entry) {
          const oldSlug = String(entry && entry.slug || '').trim();
          if (!oldSlug) return;
          const newSlug = slugMapByOldSlug[oldSlug] || oldSlug;
          if (newSlug !== oldSlug) notesUpdated += 1;
          nextNotesBySlug[newSlug] = mergeNoteLists(nextNotesBySlug[newSlug] || [], notesFromEntry(entry));
        });
        notesStore.clear();
        Object.keys(nextNotesBySlug).forEach(function(slug) {
          const notes = nextNotesBySlug[slug] || [];
          if (notes.length) notesStore.put({ slug: slug, notes: cloneValue(notes) });
        });

        await this._transactionToPromise(tx, 'Failed to rebuild slugs.');

        this._noteCache = Object.create(null);
        Object.keys(nextNotesBySlug).forEach((slug) => {
          const notes = nextNotesBySlug[slug] || [];
          if (notes.length) this._noteCache[slug] = cloneValue(notes);
        });

        return {
          ok: true,
          count: (Array.isArray(plan.songs) ? plan.songs.length : 0),
          changedCount: slugMap.length,
          setlistRefsUpdated: setlistRefsUpdated,
          notesUpdated: notesUpdated,
          slugMap: cloneValue(slugMap),
          notesMigratedInStorage: true
        };
      },

      saveSong: async function(payload) {
        await this.ready();
        const song = normalizeSongPayload(payload);
        validateSong(song);
        const originalSlug = String(song.originalSlug || '').trim();
        const replaceTitleSlug = String(payload && payload.replaceTitleSlug || '').trim();
        const tx = this._db.transaction([SONGS_STORE, SETLISTS_STORE, NOTES_STORE], 'readwrite');
        const songStore = tx.objectStore(SONGS_STORE);
        const setlistStore = tx.objectStore(SETLISTS_STORE);
        const notesStore = tx.objectStore(NOTES_STORE);
        const existingByOriginal = originalSlug ? await this._requestToPromise(songStore.get(originalSlug)) : null;
        const existingBySlug = await this._requestToPromise(songStore.get(song.slug));
        const allowOverwrite = !!(payload && payload.allowOverwrite === true);
        const overwritingDifferentSlug = !!(allowOverwrite && existingByOriginal && existingBySlug && existingByOriginal.slug !== existingBySlug.slug);
        const overwritingExistingNewSlug = !!(allowOverwrite && !originalSlug && existingBySlug);
        const replaceTitleCandidate = replaceTitleSlug && replaceTitleSlug !== originalSlug && replaceTitleSlug !== song.slug
          ? await this._requestToPromise(songStore.get(replaceTitleSlug))
          : null;
        if (!originalSlug && existingBySlug && !allowOverwrite) {
          throw new Error('DUPLICATE_SLUG');
        }
        if (existingByOriginal && existingBySlug && existingByOriginal.slug !== existingBySlug.slug && !overwritingDifferentSlug) {
          throw new Error('DUPLICATE_SLUG');
        }
        const shouldReplaceTitleSlug = !!(payload && payload.allowReplaceTitle === true && replaceTitleCandidate && String(replaceTitleCandidate.title || '').trim() === String(song.title || '').trim());
        if (payload && payload.allowReplaceTitle === true && !shouldReplaceTitleSlug) {
          throw new Error('DUPLICATE_TITLE');
        }
        const existing = overwritingDifferentSlug ? existingBySlug : (existingByOriginal || existingBySlug);
        const now = new Date().toISOString();
        const record = {
          slug: song.slug,
          title: song.title,
          artist: song.artist,
          tags: Array.isArray(song.tags) ? cloneValue(song.tags) : [],
          youtube: Array.isArray(song.youtube) ? cloneValue(song.youtube) : [],
          chordPro: song.chordPro,
          createdAt: existing && existing.createdAt ? existing.createdAt : (song.createdAt || now),
          updatedAt: now,
          scrollStartPercent: normalizeStoredPercent(song.scrollStartPercent, 0),
          scrollEndPercent: normalizeStoredPercent(song.scrollEndPercent, 1),
          scrollDurationSec: normalizeStoredDuration(song.scrollDurationSec, 240),
          transpose: normalizeStoredTranspose(song.transpose, 0),
          notation: normalizeStoredNotation(song.notation, 'default')
        };
        const slugChanged = !!(originalSlug && originalSlug !== song.slug && existingByOriginal);
        let setlistRefsUpdated = 0;
        let migratedNotes = null;
        if (slugChanged) {
          const setlists = await this._requestToPromise(setlistStore.getAll());
          (Array.isArray(setlists) ? setlists : []).forEach(function(setlist) {
            const items = normalizeSetlistItems(setlist && setlist.items);
            let changed = false;
            const nextItems = items.map(function(item) {
              if (item.slug !== originalSlug) return item;
              changed = true;
              setlistRefsUpdated += 1;
              return Object.assign({}, item, { slug: song.slug });
            });
            if (changed) {
              setlistStore.put(Object.assign({}, setlist, { items: nextItems, updatedAt: now }));
            }
          });
        }
        if (slugChanged && !overwritingDifferentSlug) {
          const oldNotesEntry = await this._requestToPromise(notesStore.get(originalSlug));
          if (oldNotesEntry) {
            const newNotesEntry = await this._requestToPromise(notesStore.get(song.slug));
            migratedNotes = mergeNoteLists(notesFromEntry(oldNotesEntry), notesFromEntry(newNotesEntry));
            if (migratedNotes.length) notesStore.put({ slug: song.slug, notes: cloneValue(migratedNotes) });
            else notesStore.delete(song.slug);
            notesStore.delete(originalSlug);
          }
        } else if (slugChanged && overwritingDifferentSlug) {
          const oldNotesEntry = await this._requestToPromise(notesStore.get(originalSlug));
          migratedNotes = notesFromEntry(oldNotesEntry);
          if (migratedNotes.length) notesStore.put({ slug: song.slug, notes: cloneValue(migratedNotes) });
          else notesStore.delete(song.slug);
          notesStore.delete(originalSlug);
        }
        if (originalSlug && originalSlug !== song.slug && existingByOriginal) {
          songStore.delete(originalSlug);
        }
        if (shouldReplaceTitleSlug) {
          songStore.delete(replaceTitleSlug);
          notesStore.delete(replaceTitleSlug);
        }
        if (overwritingExistingNewSlug) {
          notesStore.delete(song.slug);
        }
        songStore.put(record);
        await this._transactionToPromise(tx, 'Failed to save song.');
        if (slugChanged && migratedNotes) {
          if (migratedNotes.length) this._noteCache[song.slug] = cloneValue(migratedNotes);
          else delete this._noteCache[song.slug];
          delete this._noteCache[originalSlug];
        } else if (slugChanged && overwritingDifferentSlug) {
          delete this._noteCache[originalSlug];
        }
        if (overwritingExistingNewSlug) delete this._noteCache[song.slug];
        if (shouldReplaceTitleSlug) delete this._noteCache[replaceTitleSlug];
        return {
          ok: true,
          slug: song.slug,
          originalSlug: originalSlug,
          slugChanged: slugChanged,
          setlistRefsUpdated: setlistRefsUpdated,
          notesMigratedInStorage: slugChanged,
          replacedTitleSlug: shouldReplaceTitleSlug ? replaceTitleSlug : ''
        };
      },

      deleteSong: async function(slug) {
        await this.ready();
        const normalizedSlug = String(slug || '').trim();
        if (!normalizedSlug) return { ok: false, message: 'Song not found.' };
        const tx = this._db.transaction([SONGS_STORE, NOTES_STORE], 'readwrite');
        const songStore = tx.objectStore(SONGS_STORE);
        const notesStore = tx.objectStore(NOTES_STORE);
        const existing = await this._requestToPromise(songStore.get(normalizedSlug));
        if (!existing) {
          tx.abort();
          return { ok: false, message: 'Song not found.' };
        }
        notesStore.delete(normalizedSlug);
        songStore.delete(normalizedSlug);
        await this._transactionToPromise(tx, 'Failed to delete song.');
        delete this._noteCache[normalizedSlug];
        return { ok: true, notesDeleted: true };
      },

      updateSongControlSettings: async function(payload) {
        await this.ready();
        const source = payload || {};
        const slug = String(source.slug || '').trim();
        if (!slug) throw new Error('Slug is required.');
        const tx = this._db.transaction(SONGS_STORE, 'readwrite');
        const store = tx.objectStore(SONGS_STORE);
        const song = await this._requestToPromise(store.get(slug));
        if (!song) {
          tx.abort();
          return { ok: false, message: 'Song not found.' };
        }
        song.scrollStartPercent = normalizeStoredPercent(source.scrollStartPercent, song.scrollStartPercent);
        song.scrollEndPercent = normalizeStoredPercent(source.scrollEndPercent, song.scrollEndPercent);
        song.scrollDurationSec = normalizeStoredDuration(source.scrollDurationSec, song.scrollDurationSec);

async function writeSongNotesForSlug(slug, notes, options) {
  if (!window.ChordProStorage) {
    return { ok: false, error: new Error('Song note storage is unavailable.') };
  }
  pendingNoteWrite = window.ChordProStorage.writeNotesSync(slug, notes, options);
  return pendingNoteWrite;
}

function loadCurrentSongNotes(options) {
      options = options || {};
      const song = getCurrentSong();
      const slug = song && song.slug ? String(song.slug).trim() : '';
      const storageKey = getCurrentSongNoteStorageKey();
      if (!storageKey) {
        currentSongNotes = [];
        currentSongNotesSlug = '';
        editingNoteId = '';
        return currentSongNotes;
      }
      if (options.force || currentSongNotesSlug !== slug) {
        currentSongNotes = loadSongNotesForSlug(slug);
        currentSongNotesSlug = slug;
      }
      if (editingNoteId && !findSongNoteById(editingNoteId)) {
        editingNoteId = '';
        noteFocusPending = false;
      }
      return currentSongNotes;
    }

    function saveCurrentSongNotes(options) {
      options = options || {};
      const preserveNoteId = String(options.preserveNoteId || '').trim();
      const song = getCurrentSong();
      const slug = song && song.slug ? String(song.slug).trim() : '';
      if (!slug) return Promise.resolve({ ok: false, error: new Error('Missing song slug.') });
      currentSongNotesSlug = slug;
      const keepEmptyNoteIds = [editingNoteId, preserveNoteId].filter(Boolean);
      const normalized = currentSongNotes
        .map(normalizeSongNote)
        .filter(Boolean)
        .filter(function(note) {
          return note.text.length > 0 || note.id === editingNoteId || note.id === preserveNoteId;
        });
      currentSongNotes = currentSongNotes.filter(function(note) {
        const normalizedNote = normalizeSongNote(note);
        return !!normalizedNote && (normalizedNote.text.length > 0 || normalizedNote.id === editingNoteId || normalizedNote.id === preserveNoteId);
      });
      return writeSongNotesForSlug(slug, normalized, { keepEmptyNoteIds: keepEmptyNoteIds }).then(function(result) {
        if (!result.ok) {
          setSongNoteStatus('error', getStatusMessage(result && result.error, 'Failed to save notes.'));
        }
        return result;
      }).catch(function(error) {
        setSongNoteStatus('error', getStatusMessage(error, 'Failed to save notes.'));
        return { ok: false, error: error };
      });
    }

    function findSongNoteById(noteId) {
      return currentSongNotes.find(function(note) {
        return note.id === noteId;
      }) || null;
    }

    function getCurrentSongNoteFileBaseName() {
      const song = getCurrentSong();
      const slug = song && song.slug ? String(song.slug).trim() : '';
      return slug ? ('personal-chordpro-viewer-notes-' + slug) : 'personal-chordpro-viewer-notes';
    }

    function downloadSongNoteJson(filename, payload) {
      downloadJsonFile(filename, payload);
    }

    function setSongNoteStatus(type, message) {
      if (!App) return;
      if (typeof App.flashStatus === 'function' && (type === 'info' || (typeof App.isTransientStatusMessage === 'function' && App.isTransientStatusMessage(message)))) {
        App.flashStatus(type, message);
        return;
      }
      if (typeof App.setStatus === 'function') {
        App.setStatus(type, message);
        if (typeof App.render === 'function') App.render();
      }
    }

    function getCurrentSongNotesForExport() {
      commitActiveSongNote();
      return currentSongNotes
        .map(normalizeSongNote)
        .filter(Boolean)
        .filter(function(note) {
          return note.text.length > 0;
        });
    }

    function exportCurrentSongNotes() {
      const song = getCurrentSong();
      if (!song || !song.slug) {
        setSongNoteStatus('error', 'No current song to export.');
        return false;
      }
      const notes = getCurrentSongNotesForExport();
      if (!notes.length) {
        setSongNoteStatus('info', 'No sticky notes to export.');
        return false;
      }
      downloadSongNoteJson(getCurrentSongNoteFileBaseName() + '.json', {
        type: 'personal-chordpro-viewer-notes',
        version: 1,
        scope: 'song',
        exportedAt: new Date().toISOString(),
        song: {
          slug: String(song.slug || ''),
          title: String(song.title || ''),
          artist: String(song.artist || ''),
          notes: notes
        }
      });
      setSongNoteStatus('info', 'Song notes exported.');
      return false;
    }

    async function exportAllSongNotes() {
      commitActiveSongNote();
      let entries;
      try {
        const saved = await pendingNoteWrite;
        if (!saved.ok) throw saved.error;
        entries = await ChordProStorage.getAllNoteEntries();
      } catch (error) {
        setSongNoteStatus('error', 'Failed to read stored notes.');
        return false;
      }
      const exportEntries = entries.map(function(entry) {
        return {
          slug: entry.slug,
          notes: normalizeSongNoteList(entry.notes).filter(function(note) {
            return note.text.length > 0;
          })
        };
      }).filter(function(entry) {
        return entry.slug && entry.notes.length > 0;
      });
      if (!exportEntries.length) {
        setSongNoteStatus('info', 'No sticky notes to export.');
        return false;
      }
      downloadSongNoteJson('personal-chordpro-viewer-notes-all.json', {
        type: 'personal-chordpro-viewer-notes',
        version: 1,
        scope: 'all',
        exportedAt: new Date().toISOString(),
        songs: exportEntries
      });
      setSongNoteStatus('info', 'All notes exported for ' + exportEntries.length + ' song(s).');
      return false;
    }

    function openSongNoteImportDialog(scope) {
      const normalizedScope = scope === 'song' || scope === 'all' || scope === 'auto'
        ? scope
        : 'auto';
      const input = document.getElementById('viewer-note-import-input');
      if (!input) {
        setSongNoteStatus('error', 'Note import input not found.');
        return false;
      }
      input.setAttribute('data-import-scope', normalizedScope);
      input.value = '';
      input.click();
      return false;
    }

    function extractSongNoteImportRecord(payload) {
      if (payload && payload.type === 'personal-chordpro-viewer-notes' && payload.scope === 'song' && payload.song && typeof payload.song === 'object') {
        return {
          slug: String(payload.song.slug || '').trim(),
          notes: normalizeSongNoteList(payload.song.notes)
        };
      }
      if (payload && Array.isArray(payload.notes)) {
        return {
          slug: String(payload.slug || payload.songSlug || '').trim(),
          notes: normalizeSongNoteList(payload.notes)
        };
      }
      return null;
    }

    function extractAllSongNoteImportRecords(payload) {
      if (payload && payload.type === 'personal-chordpro-viewer-notes' && payload.scope === 'all' && Array.isArray(payload.songs)) {
        return payload.songs.map(function(entry) {
          return {
            slug: String(entry && entry.slug || '').trim(),
            notes: normalizeSongNoteList(entry && entry.notes)
          };
        }).filter(function(entry) {
          return entry.slug;
        });
      }
      if (payload && payload.notesBySlug && typeof payload.notesBySlug === 'object') {
        return Object.keys(payload.notesBySlug).map(function(slug) {
          return {
            slug: String(slug || '').trim(),
            notes: normalizeSongNoteList(payload.notesBySlug[slug])
          };
        }).filter(function(entry) {
          return entry.slug;
        });
      }
      return [];
    }

    function refreshCurrentSongNotesAfterImport() {
      loadCurrentSongNotes({ force: true });
      editingNoteId = '';
      noteFocusPending = false;
      toggleNoteCreateMode(false);
      renderSongNotes();
    }

    async function importCurrentSongNotesPayload(payload) {
      const song = getCurrentSong();
      if (!song || !song.slug) {
        setSongNoteStatus('error', 'No current song to import into.');
        return;
      }
      const record = extractSongNoteImportRecord(payload);
      if (!record) {
        setSongNoteStatus('error', 'Invalid song note JSON file.');
        return;
      }
      if (record.slug && record.slug !== String(song.slug)) {
        setSongNoteStatus('error', 'This note file is for a different song slug: ' + record.slug);
        return;
      }
      if (!await App.confirmAction({
        dialogId: 'import-song-notes-dialog-title',
        title: 'Replace imported notes?',
        message: 'Replace notes for this song with ' + record.notes.length + ' imported note(s)?',
        confirmText: 'Replace',
        confirmClassName: 'btn soft-accent'
      })) {
        return;
      }
      const result = await writeSongNotesForSlug(song.slug, record.notes);
      if (!result.ok) {
        setSongNoteStatus('error', getStatusMessage(result && result.error, 'Failed to import song notes.'));
        return;
      }
      refreshCurrentSongNotesAfterImport();
      setSongNoteStatus('info', 'Song notes imported.');
    }

    async function importAllSongNotesPayload(payload) {
      const records = extractAllSongNoteImportRecords(payload);
      if (!records.length) {
        setSongNoteStatus('error', 'Invalid all-song note JSON file.');
        return;
      }
      const allSongs = window.ChordProStorage && typeof window.ChordProStorage.listSongs === 'function'
        ? await window.ChordProStorage.listSongs()
        : [];
      const existingSlugMap = Object.create(null);
      (Array.isArray(allSongs) ? allSongs : []).forEach(function(song) {
        const slug = String(song && song.slug || '').trim();
        if (slug) existingSlugMap[slug] = true;
      });
      const validRecords = records.filter(function(record) {
        return !!existingSlugMap[String(record && record.slug || '').trim()];
      });
      const missingSlugs = records.filter(function(record) {
        return !existingSlugMap[String(record && record.slug || '').trim()];
      }).map(function(record) {
        return String(record && record.slug || '').trim();
      });
      if (!validRecords.length) {
        setSongNoteStatus(
          'error',
          missingSlugs.length
            ? ('No matching songs were found. Nothing was imported. Missing slug(s): ' + missingSlugs.join(', '))
            : 'No matching songs were found. Nothing was imported.'
        );
        return;
      }
      const backups = validRecords.map(function(record) {
        return {
          slug: record.slug,
          notes: loadSongNotesForSlug(record.slug)
        };
      });
      const totalNotes = validRecords.reduce(function(sum, record) {
        return sum + record.notes.length;
      }, 0);
      let confirmMessage = 'Import notes for ' + validRecords.length + ' existing song(s) and replace their existing notes?';
      if (missingSlugs.length) {
        confirmMessage += '\n\nThese slug(s) do not exist and will be skipped:\n- ' + missingSlugs.join('\n- ');
      }
      if (!await App.confirmAction({
        dialogId: 'import-all-song-notes-dialog-title',
        title: 'Import notes?',
        message: confirmMessage,
        confirmText: 'Import',
        confirmClassName: 'btn soft-accent'
      })) {
        return;
      }
      for (let i = 0; i < validRecords.length; i += 1) {
        const result = await writeSongNotesForSlug(validRecords[i].slug, validRecords[i].notes);
        if (!result.ok) {
          for (let j = 0; j < backups.length; j += 1) {
            await writeSongNotesForSlug(backups[j].slug, backups[j].notes);
          }
          setSongNoteStatus('error', getStatusMessage(result && result.error, 'Failed to import all notes.'));
          return;
        }
      }
      const currentSong = getCurrentSong();
      if (currentSong && currentSong.slug && validRecords.some(function(record) { return record.slug === String(currentSong.slug); })) {
        refreshCurrentSongNotesAfterImport();
      } else {
        toggleNoteCreateMode(false);
      }
      let statusMessage = 'Imported ' + totalNotes + ' note(s) for ' + validRecords.length + ' song(s).';
      if (missingSlugs.length) {
        statusMessage += ' Skipped missing slug(s): ' + missingSlugs.join(', ') + '.';
      }
      setSongNoteStatus(missingSlugs.length ? 'warning' : 'info', statusMessage);
    }

    function handleSongNoteImportChange(event, scope) {
      const input = event && event.target ? event.target : null;
      const file = input && input.files && input.files[0] ? input.files[0] : null;
      const requestedScope = scope || (input ? String(input.getAttribute('data-import-scope') || 'auto') : 'auto');
      if (input) {
        input.value = '';
        input.removeAttribute('data-import-scope');
      }
      if (!file) return false;
      commitActiveSongNote();
      const reader = new FileReader();
      reader.onload = async function(loadEvent) {
        try {
          const raw = loadEvent && loadEvent.target ? String(loadEvent.target.result || '') : '';
          const payload = JSON.parse(raw);
          if (requestedScope === 'all') {
            importAllSongNotesPayload(payload);
            return;
          }
          if (requestedScope === 'song') {
            importCurrentSongNotesPayload(payload);
            return;
          }
          const songRecord = extractSongNoteImportRecord(payload);
          if (songRecord) {
            importCurrentSongNotesPayload(payload);
            return;
          }
          const allRecords = extractAllSongNoteImportRecords(payload);
          if (allRecords.length) {
            importAllSongNotesPayload(payload);
            return;
          }
          setSongNoteStatus('error', 'Invalid note JSON file.');
        } catch (err) {
          setSongNoteStatus('error', getStatusMessage(err, 'Failed to read note JSON file.'));
        }
      };
      reader.onerror = function() {
        setSongNoteStatus('error', 'Failed to read note JSON file.');
      };
      reader.readAsText(file);
      return false;
    }

    function importSongNotes() {
      return openSongNoteImportDialog('auto');
    }

    function importCurrentSongNotes() {
      return importSongNotes();
    }

    function importAllSongNotes() {
      return importSongNotes();
    }

    function getSongNoteIndex(noteId) {
      return currentSongNotes.findIndex(function(note) {
        return note.id === noteId;
      });
    }

    function getSheetStageMetrics(stage) {
      if (!stage) return { width: 1, height: 1 };
      const sheet = stage.querySelector ? stage.querySelector('.cw-sheet') : null;
      const contentHeight = sheet
        ? Math.max(sheet.scrollHeight, sheet.offsetHeight, stage.clientHeight, 1)
        : Math.max(stage.scrollHeight, stage.offsetHeight, stage.clientHeight, 1);
      return {
        width: Math.max(stage.clientWidth, 1),
        height: contentHeight
      };
    }

    function getNotePreviewText(text) {
      const normalized = String(text || '').replace(/\s+/g, ' ').trim();
      return normalized ? normalized.slice(0, 80) : 'Open note';
    }

    function getStagePercentFromEvent(event, stage) {
      const source = event && event.touches ? event.touches[0] : event;
      const rect = stage.getBoundingClientRect();
      const metrics = getSheetStageMetrics(stage);
      const context = getSongNoteLineContext(stage, metrics);
      const rawX = (source.clientX || 0) - rect.left;
      return {
        xPx: Math.max(0, Math.round(rawX)),
        xPercent: clampNotePercent(rawX / Math.max(metrics.width, 1), 0.5),
        yPercent: getSongNoteYPercentFromClientY(source.clientY || 0, stage, context)
      };
    }

    function getSongNoteLineContext(stage, metrics) {
      metrics = metrics || getSheetStageMetrics(stage);
      const els = cacheElements();
      const scrollTarget = getScrollTarget(els);
      const scrollTop = getScrollTop(scrollTarget);
      const viewportTop = getViewportTop(scrollTarget);
      const stageRect = stage && stage.getBoundingClientRect ? stage.getBoundingClientRect() : { top: 0 };
      const stageTop = scrollTop + stageRect.top - viewportTop;
      const lineMetrics = getAutoscrollLineMetrics(els, scrollTarget, stageTop, metrics.height);
      return {
        metrics: metrics,
        stageTop: stageTop,
        lineMetrics: lineMetrics
      };
    }

    function getSongNoteYPercentFromStageTopPx(topPx, stage, context) {
      context = context || getSongNoteLineContext(stage);
      const fallback = Number(topPx) / Math.max(context.metrics.height, 1);
      const y = context.stageTop + (Number.isFinite(Number(topPx)) ? Number(topPx) : 0);
      return clampNotePercent(getAutoscrollPercentForY(y, context.lineMetrics, context.stageTop, context.metrics.height), fallback);
    }

    function getSongNoteYPercentFromClientY(clientY, stage, context) {
      const rect = stage.getBoundingClientRect();
      return getSongNoteYPercentFromStageTopPx((Number(clientY) || 0) - rect.top, stage, context);
    }

    function getSongNoteTopPx(note, stage, context) {
      context = context || getSongNoteLineContext(stage);
      return Math.round(
        getYForAutoscrollPercent(clampNotePercent(note && note.yPercent, 0.5), context.lineMetrics, context.stageTop, context.metrics.height)
        - context.stageTop
      );
    }

    function getSongNoteClampBounds(stage, options, metrics) {
      metrics = metrics || getSheetStageMetrics(stage);
      const keepDotInside = !!(options && options.keepDotInside);
      if (!keepDotInside) {
        return {
          minXPx: 0,
          maxXPx: metrics.width,
          minY: 0,
          maxY: 1,
          width: metrics.width,
          height: metrics.height
        };
      }
      const minXPx = NOTE_DOT_EDGE_MARGIN_PX;
      const minYPx = NOTE_DOT_EDGE_MARGIN_PX;
      const maxXPx = Math.max(minXPx, metrics.width - NOTE_DOT_SIZE_PX - NOTE_DOT_EDGE_MARGIN_PX);
      const maxYPx = Math.max(minYPx, metrics.height - NOTE_DOT_SIZE_PX - NOTE_DOT_EDGE_MARGIN_PX);
      return {
        minXPx: minXPx,
        maxXPx: maxXPx,
        minY: minYPx / Math.max(metrics.height, 1),
        maxY: maxYPx / Math.max(metrics.height, 1),
        width: metrics.width,
        height: metrics.height
      };
    }

    function getSongNoteLeftPx(note, metrics) {
      const storedPx = note && note.xPx !== undefined && note.xPx !== null && note.xPx !== ''
        ? Number(note.xPx)
        : NaN;
      if (Number.isFinite(storedPx)) return Math.round(storedPx);
      return Math.round(clampNotePercent(note && note.xPercent, 0.5) * Math.max(metrics && metrics.width || 1, 1));
    }

    function clampSongNotePosition(note, stage, xPx, yPercent, options, metrics) {
      const bounds = getSongNoteClampBounds(stage, options, metrics);
      const nextXPx = Number.isFinite(Number(xPx)) ? Math.round(Number(xPx)) : getSongNoteLeftPx(note, bounds);
      return {
        xPx: Math.max(bounds.minXPx, Math.min(bounds.maxXPx, nextXPx)),
        yPercent: Math.max(bounds.minY, Math.min(bounds.maxY, Number.isFinite(yPercent) ? yPercent : note.yPercent))
      };
    }

    function getSongNotePixelPosition(note, stage, options, context) {
      context = context || getSongNoteLineContext(stage);
      const metrics = context.metrics;
      const position = clampSongNotePosition(note, stage, getSongNoteLeftPx(note, metrics), note.yPercent, options, metrics);
      return {
        metrics: metrics,
        position: position,
        leftPx: Math.round(position.xPx),
        topPx: getSongNoteTopPx(position, stage, context)
      };
    }

    function setSongNoteElementPosition(element, note, stage, context) {
      if (!element || !note || !stage) return;
      context = context || getSongNoteLineContext(stage);
      if (element.classList.contains('viewer-note-dot')) {
        const pixelPosition = getSongNotePixelPosition(note, stage, null, context);
        element.style.left = pixelPosition.leftPx + 'px';
        element.style.top = pixelPosition.topPx + 'px';
        return;
      }
      element.style.cssText = getSongNoteInlineStyle(note, stage, context);
      element.classList.remove('is-left');
      element.classList.remove('is-up');
    }

    function clearActiveNoteDrag(options) {
      options = options || {};
      if (!activeNoteDrag) return null;
      stopSongNoteDragAutoScroll();
      const state = activeNoteDrag;
      activeNoteDrag = null;
      if (!options.keepPointerCapture && state.element && typeof state.element.releasePointerCapture === 'function') {
        try {
          state.element.releasePointerCapture(state.pointerId);
        } catch (error) {}
      }
      if (state.element) {
        state.element.classList.remove('is-dragging');
      }
      return state;
    }

    function stopSongNoteDragAutoScroll() {
      if (noteDragAutoScrollRafId) cancelAnimationFrame(noteDragAutoScrollRafId);
      noteDragAutoScrollRafId = 0;
    }

    function clearActiveNoteResize(options) {
      options = options || {};
      if (!activeNoteResize) return null;
      const state = activeNoteResize;
      activeNoteResize = null;
      if (!options.keepPointerCapture && state.element && typeof state.element.releasePointerCapture === 'function') {
        try {
          state.element.releasePointerCapture(state.pointerId);
        } catch (error) {}
      }
      if (state.element) {
        state.element.classList.remove('is-dragging');
      }
      return state;
    }

    function clearActiveNoteInteraction(options) {
      clearActiveNoteDrag(options);
      clearActiveNoteResize(options);
    }

    function maybeBeginSongNoteResize(event) {
      const stage = resolveSongNoteStageFromEvent(event) || cacheElements().sheetStage;
      if (!stage) return false;
      const target = event && event.target;
      if (!target || !target.closest) return false;
      const resizeTarget = target.closest('[data-note-resize]');
      if (!resizeTarget) return false;
      const noteId = resizeTarget.dataset.noteId || '';
      const note = findSongNoteById(noteId);
      if (!note) return false;
      const pointer = event && event.touches ? event.touches[0] : event;
      if (!pointer || typeof pointer.clientX !== 'number' || typeof pointer.clientY !== 'number') return false;
      clearActiveNoteInteraction({ keepPointerCapture: true });
      const resizeElement = resizeTarget.closest('.viewer-note-card, .viewer-note-popover') || resizeTarget;
      activeNoteResize = {
        noteId: noteId,
        pointerId: typeof event.pointerId === 'number' ? event.pointerId : null,
        stage: stage,
        element: resizeTarget,
        resizeElement: resizeElement,
        startClientX: pointer.clientX,
        startClientY: pointer.clientY,
        originWidthPx: note.widthPx,
        originHeightPx: note.heightPx,
        moved: false
      };
      resizeTarget.classList.add('is-dragging');
      if (typeof resizeTarget.setPointerCapture === 'function' && typeof event.pointerId === 'number') {
        try {
          resizeTarget.setPointerCapture(event.pointerId);
        } catch (error) {}
      }
      if (event.cancelable) event.preventDefault();
      if (event.stopPropagation) event.stopPropagation();
      return true;
    }

    function handleActiveSongNoteResizeMove(event) {
      if (!activeNoteResize) return false;
      if (typeof activeNoteResize.pointerId === 'number' && typeof event.pointerId === 'number' && activeNoteResize.pointerId !== event.pointerId) {
        return false;
      }
      const note = findSongNoteById(activeNoteResize.noteId);
      if (!note) {
        clearActiveNoteResize();
        return false;
      }
      const pointer = event && event.touches ? event.touches[0] : event;
      if (!pointer || typeof pointer.clientX !== 'number' || typeof pointer.clientY !== 'number') return false;
      const deltaX = pointer.clientX - activeNoteResize.startClientX;
      const deltaY = pointer.clientY - activeNoteResize.startClientY;
      if (!activeNoteResize.moved && Math.hypot(deltaX, deltaY) < NOTE_DRAG_START_THRESHOLD_PX) {
        return true;
      }
      activeNoteResize.moved = true;
      const nextWidth = clampNoteDimension(activeNoteResize.originWidthPx + deltaX, NOTE_MIN_WIDTH_PX, NOTE_MAX_WIDTH_PX, note.widthPx || NOTE_DEFAULT_WIDTH_PX);
      const nextHeight = clampNoteDimension(activeNoteResize.originHeightPx + deltaY, NOTE_MIN_HEIGHT_PX, NOTE_MAX_HEIGHT_PX, note.heightPx || NOTE_DEFAULT_HEIGHT_PX);
      note.widthPx = nextWidth;
      note.heightPx = nextHeight;
      if (activeNoteResize.resizeElement) {
        activeNoteResize.resizeElement.style.width = nextWidth + 'px';
        activeNoteResize.resizeElement.style.height = nextHeight + 'px';
      }
      if (event.cancelable) event.preventDefault();
      if (event.stopPropagation) event.stopPropagation();
      return true;
    }

    function finishActiveSongNoteResize(event) {
      if (!activeNoteResize) return false;
      if (typeof activeNoteResize.pointerId === 'number' && event && typeof event.pointerId === 'number' && activeNoteResize.pointerId !== event.pointerId) {
        return false;
      }
      const state = clearActiveNoteResize();
      if (!state) return false;
      if (state.moved) {
        saveCurrentSongNotes({ preserveNoteId: editingNoteId || state.noteId });
        if (event && event.cancelable) event.preventDefault();
        if (event && event.stopPropagation) event.stopPropagation();
      }
      return true;
    }

    function maybeBeginSongNoteDrag(event) {
      const stage = resolveSongNoteStageFromEvent(event) || cacheElements().sheetStage;
      if (!stage) return false;
      const target = event && event.target;
      if (!target || !target.closest) return false;
      if (target.closest('#viewer-note-textarea')) return false;
      const dragTarget = target.closest('[data-note-drag]');
      if (!dragTarget) return false;
      const actionTarget = target.closest('[data-note-action]');
      if (actionTarget && actionTarget !== dragTarget) return false;
      const noteId = dragTarget.dataset.noteId || '';
      const note = findSongNoteById(noteId);
      if (!note) return false;
      const metrics = getSheetStageMetrics(stage);

    function getViewportTop(target) {
      if (!target || target === document.body || target === document.documentElement || target === document.scrollingElement) {
        return 0;
      }

    }

    function getViewportHeight(target) {
      if (!target || target === document.body || target === document.documentElement || target === document.scrollingElement) {
        return window.innerHeight || document.documentElement.clientHeight || 0;
      }
      return target.clientHeight;
    }

    function getAutoscrollLineNodes(els) {
      const stage = els && els.sheetStage;
      if (!stage) return [];
      return Array.prototype.slice.call(stage.querySelectorAll(
        '.cw-renderer > .cw-line, .cw-renderer > .cw-plain-line, .cw-renderer > .cw-empty-line, .cw-renderer > .cw-directive-line'
      ));
    }

    function getAutoscrollLineMetrics(els, scrollTarget, stageTop, stageHeight) {
      const stageBottom = stageTop + Math.max(stageHeight || 1, 1);
      const scrollTop = getScrollTop(scrollTarget);
      const viewportTop = getViewportTop(scrollTarget);
      const lineBoxes = getAutoscrollLineNodes(els).map(function(node) {
        const rect = node.getBoundingClientRect();
        return {
          top: scrollTop + rect.top - viewportTop,
          bottom: scrollTop + rect.bottom - viewportTop
        };
      }).filter(function(box) {
        return Number.isFinite(box.top) && Number.isFinite(box.bottom) && box.bottom >= box.top;
      }).sort(function(a, b) {
        return a.top - b.top;
      });
      const boundaries = [];
      let lastLineBottom = null;
      lineBoxes.forEach(function(box) {
        const clampedTop = Math.max(stageTop, Math.min(stageBottom, box.top));
        const clampedBottom = Math.max(stageTop, Math.min(stageBottom, box.bottom));
        if (!boundaries.length || Math.abs(clampedTop - boundaries[boundaries.length - 1]) > 0.5) {
          boundaries.push(clampedTop);
        }
        lastLineBottom = lastLineBottom === null ? clampedBottom : Math.max(lastLineBottom, clampedBottom);
      });
      if (!boundaries.length) {
        return {
          boundaries: [stageTop, stageBottom],
          lineSlotCount: 0
        };
      }
      const scoreBottom = Math.max(boundaries[boundaries.length - 1] + 1, lastLineBottom === null ? stageBottom : lastLineBottom);
      if (Math.abs(scoreBottom - boundaries[boundaries.length - 1]) > 0.5) {
        boundaries.push(scoreBottom);
      } else {
        boundaries[boundaries.length - 1] = scoreBottom;
      }
      return {
        boundaries: boundaries,
        lineSlotCount: Math.max(1, boundaries.length - 1)

    function getYForAutoscrollPercent(percent, metrics, stageTop, stageHeight) {
      const safePercent = Math.max(0, Math.min(1, parseFloat(percent) || 0));
      if (!metrics || !metrics.lineSlotCount || !metrics.boundaries || metrics.boundaries.length < 2) {
        return stageTop + (safePercent * Math.max(stageHeight || 1, 1));
      }
      const slotCount = metrics.lineSlotCount;
      if (safePercent >= 1) return metrics.boundaries[slotCount];
      const scaled = safePercent * slotCount;
      const slotIndex = Math.max(0, Math.min(slotCount - 1, Math.floor(scaled)));
      const slotProgress = Math.max(0, Math.min(1, scaled - slotIndex));
      const from = metrics.boundaries[slotIndex];
      const to = metrics.boundaries[slotIndex + 1];

    function getAutoscrollPercentForY(y, metrics, stageTop, stageHeight) {
      const safeY = Number(y);
      if (!Number.isFinite(safeY)) return 0;
      if (!metrics || !metrics.lineSlotCount || !metrics.boundaries || metrics.boundaries.length < 2) {
        return Math.max(0, Math.min(1, (safeY - stageTop) / Math.max(stageHeight || 1, 1)));
      }
      const slotCount = metrics.lineSlotCount;
      const first = metrics.boundaries[0];
      const last = metrics.boundaries[slotCount];
      const clampedY = Math.max(first, Math.min(last, safeY));
      if (clampedY <= first) return 0;
      if (clampedY >= last) return 1;
      for (let i = 0; i < slotCount; i += 1) {
        const from = metrics.boundaries[i];
        const to = metrics.boundaries[i + 1];
        if (clampedY <= to || i === slotCount - 1) {
          const span = Math.max(1, to - from);
          return Math.max(0, Math.min(1, (i + ((clampedY - from) / span)) / slotCount));

    function getAutoscrollPercentForClientY(clientY) {

    function getGeometry() {
      const els = cacheElements();
      if (!els.sheetStage) return null;
      const scrollTarget = getScrollTarget(els);
      const stageRect = els.sheetStage.getBoundingClientRect();
      const stageHeight = Math.max(els.sheetStage.offsetHeight, els.sheetStage.scrollHeight, stageRect.height, 1);
      const stageTop = getScrollTop(scrollTarget) + stageRect.top - getViewportTop(scrollTarget);
      const lineMetrics = getAutoscrollLineMetrics(els, scrollTarget, stageTop, stageHeight);
      const startY = getYForAutoscrollPercent(App.state.scroll.startPercent, lineMetrics, stageTop, stageHeight);
      const endY = getYForAutoscrollPercent(App.state.scroll.endPercent, lineMetrics, stageTop, stageHeight);
      return {
        els: els,
        scrollTarget: scrollTarget,
        stageHeight: stageHeight,
        stageTop: stageTop,
        lineMetrics: lineMetrics,
        lineSlotCount: lineMetrics ? lineMetrics.lineSlotCount : 0,
        startY: startY,
        endY: endY,
        distance: Math.max(0, endY - startY),

      const minGap = getMinMarkerGapPercent(geometry);
      let startPercent = Math.max(0, Math.min(1, App.state.scroll.startPercent || 0));
      let endPercent = Math.max(0, Math.min(1, App.state.scroll.endPercent || 0));

      if (endPercent - startPercent < minGap) {
        if (startPercent + minGap <= 1) {
          endPercent = startPercent + minGap;
        } else {
          startPercent = Math.max(0, endPercent - minGap);
        }
      }

      App.state.scroll.startPercent = startPercent;
      App.state.scroll.endPercent = Math.max(startPercent + minGap, endPercent);

        App.state.scroll.startPercent = Math.max(0, 1 - minGap);

    function syncAutoscrollUi() {

      const endPercent = Math.max(startPercent, Math.min(1, App.state.scroll.endPercent || 0));
      const startTopPx = geometry ? Math.max(0, getYForAutoscrollPercent(startPercent, geometry.lineMetrics, geometry.stageTop, geometry.stageHeight) - geometry.stageTop) : 0;
      const endTopPx = geometry ? Math.max(startTopPx, getYForAutoscrollPercent(endPercent, geometry.lineMetrics, geometry.stageTop, geometry.stageHeight) - geometry.stageTop) : startTopPx;

    function tick(time) {

        scrollTarget,
        Math.min(autoscrollSegmentEndTop, nextTop)

      maybeCaptureObservedScrollDuration();

      if (progress >= 1 || exactScrollTop >= autoscrollSegmentEndTop) {
        maybeCaptureObservedScrollDuration();
        App.state.scroll.isPlaying = false;
        hasStarted = false;
        clearManualScrollIntent();
        resetObservedScrollMeasurement({ keepPendingObservedDuration: true });
        clearAutoscrollSegment();
        syncAutoscrollUi();
        rafId = null;
        lastTime = 0;
        return;
      }

      rafId = requestAnimationFrame(tick);
    }

    function toggleAutoScroll() {
      if (App.state.scroll.isPlaying) {
        pauseAutoScroll();
        adjustAdaptiveSpeed('slower');
      } else {
        startAutoScroll();
      }
    }

    function blurActiveControlFromSheet(event) {
      const target = event && event.target;
      if (target && target.closest && target.closest('.autoscroll-marker')) return;
      const active = document.activeElement;
      if (!active || active === document.body) return;
      const tagName = active.tagName ? String(active.tagName).toLowerCase() : '';
      const isInteractive = tagName === 'input' || tagName === 'textarea' || tagName === 'select' || tagName === 'button' || active.isContentEditable;
      const isViewerFocus = !!(active.closest && active.closest('#viewer-content'));
      if (!isInteractive && !isViewerFocus) return;
      if (typeof active.blur === 'function') active.blur();
    }

    function handleSheetTouchStart(event) {
      const touches = Array.from(event.touches);
      if (touches.length === 1 || (!sheetTwoFingerTap && touches.length === 2)) {
        sheetTwoFingerTap = {
          stage: event.currentTarget,
          startedAt: performance.now(),
          scrollTarget: getScrollTarget(),
          scrollTop: getScrollTop(getScrollTarget()),
          points: [],
          cancelled: false,
          releasing: false
        };
      }
      const tap = sheetTwoFingerTap;
      if (!tap) return;
      if (touches.length > 2 || tap.releasing) tap.cancelled = true;
      touches.forEach(function(touch) {
        if (tap.points.some(function(point) { return point.id === touch.identifier; })) return;
        if (!touch.target || !touch.target.closest ||
            touch.target.closest('.sheet-stage') !== tap.stage ||
            touch.target.closest('.viewer-note-ui, .autoscroll-marker, .cw-tempo-sound-btn')) {
          tap.cancelled = true;
        }
        tap.points.push({ id: touch.identifier, x: touch.clientX, y: touch.clientY });
      });
      if (tap.points.length >= 2) sheetTouchClickSuppressUntil = performance.now() + 500;
      trackSheetTouchMovement(event);
    }

    function trackSheetTouchMovement(event) {
      const tap = sheetTwoFingerTap;
      if (!tap) return;
      if (performance.now() - tap.startedAt > TWO_FINGER_TAP_MAX_MS ||
          getScrollTarget() !== tap.scrollTarget ||
          Math.abs(getScrollTop(tap.scrollTarget) - tap.scrollTop) > 2) tap.cancelled = true;
      Array.from(event.touches).concat(Array.from(event.changedTouches)).forEach(function(touch) {
        const point = tap.points.find(function(point) { return point.id === touch.identifier; });
        if (!point || Math.hypot(touch.clientX - point.x, touch.clientY - point.y) > TWO_FINGER_TAP_MOVE_PX) {
          tap.cancelled = true;
        }
      });
    }

    function handleSheetTouchEnd(event) {
      const tap = sheetTwoFingerTap;
      if (!tap) return;
      trackSheetTouchMovement(event);
      tap.releasing = true;
      if (tap.points.length >= 2) sheetTouchClickSuppressUntil = performance.now() + 500;
      if (event.touches.length) return;
      sheetTwoFingerTap = null;
      if (tap.cancelled || tap.points.length !== 2) return;
      if (event.cancelable) event.preventDefault();
      clearActiveNoteInteraction();
      toggleNoteCreateMode(false);
      triggerSongNoteFromPointer({
        clientX: (tap.points[0].x + tap.points[1].x) / 2,
        clientY: (tap.points[0].y + tap.points[1].y) / 2
      }, tap.stage);
    }

    function handleSheetPointerDown(event) {
      const els = cacheElements();
      const target = event && event.target;
      const isRightButton = !!(event && (event.button === 2 || event.which === 3));
      const isMarker = !!(target && target.closest && target.closest('.autoscroll-marker'));
      const isNoteUi = !!(target && target.closest && target.closest('.viewer-note-ui'));
      const isTempoSoundButton = !!(target && target.closest && target.closest('.cw-tempo-sound-btn'));
      if (isTempoSoundButton) return true;
      if (isRightButton) {
        const stage = resolveSongNoteStageFromEvent(event) || els.sheetStage;
        if (!stage) return false;
        toggleNoteCreateMode(false);
        if (event.cancelable) event.preventDefault();
        if (event.stopPropagation) event.stopPropagation();
        triggerSongNoteFromPointer(event, stage);
        return false;
      }
      // Placement is committed by click after a tap, never at pan start.
      if (noteCreateMode) return true;
      const isSheetSurface = !!(target && target.closest && target.closest('.sheet-stage, .cw-sheet'));
      const pointerType = event && typeof event.pointerType === 'string' ? event.pointerType : '';
      if (!isNoteUi && !isMarker && isSheetSurface && event && event.cancelable && pointerType !== 'touch') {
        event.preventDefault();
      }
      if (!isNoteUi && !isMarker) {
        blurActiveControlFromSheet(event);
      }
      return true;
    }

    function handleSheetContextMenu(event) {
      if (event && event.cancelable) event.preventDefault();
      return false;
    }

    function suppressNextSheetAutoScrollToggle() {
      suppressSheetAutoScrollToggleUntil = performance.now() + SHEET_AUTOSCROLL_TOGGLE_SUPPRESS_MS;
    }

    function shouldSuppressSheetAutoScrollToggle() {
      if (!suppressSheetAutoScrollToggleUntil) return false;
      if (performance.now() > suppressSheetAutoScrollToggleUntil) {
        suppressSheetAutoScrollToggleUntil = 0;
        return false;
      }
      suppressSheetAutoScrollToggleUntil = 0;
      return true;
    }

    function toggleAutoScrollFromSheet(event) {
      if (performance.now() < sheetTouchClickSuppressUntil) return;
      if (isDraggingMarker || noteCreateMode) return;
      if (manualScrollSession && manualScrollSession.moved) {
        suppressNextSheetAutoScrollToggle();
        return;
      }
      if (shouldSuppressSheetAutoScrollToggle()) return;
      if (event && event.target && event.target.closest && event.target.closest('.autoscroll-marker')) return;
      if (event && event.target && event.target.closest && event.target.closest('.viewer-note-ui')) return;
      if (event && event.target && event.target.closest && event.target.closest('.cw-tempo-sound-btn')) return;
      blurActiveControlFromSheet(event);
      toggleAutoScroll();

    function setMarkerPercent(which, percent, options) {
      options = options || {};
      const geometry = getGeometry();
      const minGap = getMinMarkerGapPercent(geometry);
      const clamped = Math.max(0, Math.min(1, percent));
      if (which === 'start') {
        App.state.scroll.startPercent = Math.min(clamped, Math.max(0, App.state.scroll.endPercent - minGap));
        hasStarted = false;
      } else {
        App.state.scroll.endPercent = Math.max(clamped, Math.min(1, App.state.scroll.startPercent + minGap));
      }
      normalizeScrollBounds();
      if (!options.skipUiSync) syncAutoscrollUi();
    }

    function beginMarkerDrag(event, which) {
      const geometry = getGeometry();
      if (!geometry || !geometry.scrollTarget || !geometry.els.sheetStage) return;
      if (event && event.cancelable) event.preventDefault();
      if (event && event.stopPropagation) event.stopPropagation();

      isDraggingMarker = true;
      lastDragClientY = event && event.touches ? event.touches[0].clientY : event.clientY;
      const dragSessionId = ++markerDragSessionId;
      let markerChanged = false;

      const updateFromClientY = function(clientY) {
        lastDragClientY = clientY;
        const before = which === 'start' ? App.state.scroll.startPercent : App.state.scroll.endPercent;
        setMarkerPercent(which, getAutoscrollPercentForClientY(clientY));
        const after = which === 'start' ? App.state.scroll.startPercent : App.state.scroll.endPercent;
        if (Math.abs(after - before) > 0.000001) markerChanged = true;
      };

      let ended = false;

      const handleEnd = function() {
        if (ended) return;
        ended = true;
        if (autoDragRafId) cancelAnimationFrame(autoDragRafId);
        autoDragRafId = null;
        document.removeEventListener('mousemove', handleMove);
        document.removeEventListener('mouseup', handleEnd);
        document.removeEventListener('touchmove', handleMove);
        document.removeEventListener('touchend', handleEnd);
        document.removeEventListener('touchcancel', handleEnd);
        window.removeEventListener('mouseup', handleEnd);
        window.removeEventListener('mouseout', handleWindowMouseOut, true);
        window.removeEventListener('blur', handleEnd);
        document.removeEventListener('visibilitychange', handleVisibilityChange);
        if (markerChanged) handleScrollBoundsChange(which);
        window.setTimeout(function() {
          if (dragSessionId === markerDragSessionId) isDraggingMarker = false;
        }, 80);
      };

      const handleWindowMouseOut = function(outEvent) {
        if (!outEvent.relatedTarget) handleEnd();
      };

      const handleVisibilityChange = function() {
        if (document.hidden) handleEnd();
      };

      const handleMove = function(moveEvent) {
        if (moveEvent.type === 'mousemove' && moveEvent.buttons === 0) {
          handleEnd();
          return;
        }
        const pointer = moveEvent.touches ? moveEvent.touches[0] : moveEvent;
        if (!pointer || typeof pointer.clientY !== 'number') return;
        if (moveEvent.cancelable) moveEvent.preventDefault();
        updateFromClientY(pointer.clientY);
      };

      const autoScrollPane = function() {
        if (ended) return;
        const scrollTarget = geometry.scrollTarget;
        if (!scrollTarget) return;
        const paneRect = scrollTarget === document.body || scrollTarget === document.documentElement || scrollTarget === document.scrollingElement
          ? { top: 0, bottom: window.innerHeight || document.documentElement.clientHeight || 0 }
          : scrollTarget.getBoundingClientRect();
        const edgeThreshold = 60;
        const scrollStep = 14;
        let didScroll = false;
        const currentTop = getScrollTop(scrollTarget);

        if (lastDragClientY < paneRect.top + edgeThreshold) {
          const next = Math.max(0, currentTop - scrollStep);
          if (next !== currentTop) {
            setProgrammaticScrollTop(scrollTarget, next);
            didScroll = true;
          }
        } else if (lastDragClientY > paneRect.bottom - edgeThreshold) {
          const viewportHeight = getViewportHeight(scrollTarget);
          const maxTop = Math.max(0, scrollTarget.scrollHeight - viewportHeight);
          const next = Math.min(maxTop, currentTop + scrollStep);
          if (next !== currentTop) {
            setProgrammaticScrollTop(scrollTarget, next);
            didScroll = true;
          }
        }

        if (didScroll) {
          exactScrollTop = getScrollTop(scrollTarget);
          updateFromClientY(lastDragClientY);
        }
        autoDragRafId = requestAnimationFrame(autoScrollPane);
      };

      document.addEventListener('mousemove', handleMove);
      document.addEventListener('mouseup', handleEnd);
      document.addEventListener('touchmove', handleMove, { passive: false });
      document.addEventListener('touchend', handleEnd);
      document.addEventListener('touchcancel', handleEnd);
      window.addEventListener('mouseup', handleEnd);
      window.addEventListener('mouseout', handleWindowMouseOut, true);
      window.addEventListener('blur', handleEnd);
      document.addEventListener('visibilitychange', handleVisibilityChange);
      updateFromClientY(lastDragClientY);
      autoDragRafId = requestAnimationFrame(autoScrollPane);
    }

    function handleMarkerMouseDown(which, event) {
      beginMarkerDrag(event, which);
    }

    function handleScrollBoundsChange(which) {
      if (which === 'start') hasStarted = false;
      resetObservedScrollMeasurement({ keepPendingObservedDuration: true });
