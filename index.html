    <script>
  const FONT_PRESETS = window.__PCV_FONT_PRESETS__;

  const STORAGE_KEYS = {
    fontSizeLevel: 'personal_chordpro_viewer_fontSizeLevel',
    chordSizeLevel: 'personal_chordpro_viewer_chordSizeLevel',
    formatOptions: 'personal_chordpro_viewer_chordFormatOptions',
    lyricsFont: 'personal_chordpro_viewer_lyricsFont',
    chordFont: 'personal_chordpro_viewer_chordFont',
    accentColor: 'personal_chordpro_viewer_accentColor',
    noteColor: 'personal_chordpro_viewer_noteColor',
    viewerSidebarWidth: 'personal_chordpro_viewer_viewerSidebarWidth',
    viewerSidebarCollapsed: 'personal_chordpro_viewer_viewerSidebarCollapsed',
    gasSyncUrl: 'personal_chordpro_viewer_gasSyncUrl',
    gasSyncEditPasswordSession: 'personal_chordpro_viewer_gasSyncEditPasswordSession'
  };

  function normalizeFontToken(kind, storedValue) {
    const presets = FONT_PRESETS;
    const raw = String(storedValue || '').trim();
    const normalized = raw;
    const defaultToken = kind === 'chord' ? 'musejazztextlocal' : (kind === 'lyrics' ? 'lineseedjp' : '');
    const fallback = presets.find(function(item) { return item.value === defaultToken; }) || presets[0];
    if (!normalized) return fallback ? fallback.value : '';
    const matched = presets.find(function(item) {
      return item.value === normalized || item.stack === normalized;
    });
    return matched ? matched.value : (fallback ? fallback.value : normalized);
  }

  function getFontStack(kind, token) {
    const presets = FONT_PRESETS;
    const normalized = String(token || '').trim();
    const matched = presets.find(function(item) { return item.value === normalized; });
    return matched ? matched.stack : (presets[0] ? presets[0].stack : 'sans-serif');
  }

  function cloneFontList(list) {
    return (Array.isArray(list) ? list : []).map(function(item) {
      return {
        value: item.value,
        label: item.label,
        stack: item.stack
      };
    });
  }

  function mergeFontLists(baseList, extraList) {
    const merged = [];
    const seen = Object.create(null);

    cloneFontList(baseList).forEach(function(item) {
      const key = String(item && item.value || '').trim();
      if (!key || seen[key]) return;
      seen[key] = true;
      merged.push(item);
    });

    cloneFontList(extraList).forEach(function(item) {
      const key = String(item && item.value || '').trim();
      if (!key || seen[key]) return;
      seen[key] = true;
      merged.push(item);
    });

    return merged;
  }

  function resolveFontConfig(config) {
    const resolved = config || {};
    const serverFonts = Array.isArray(resolved.fonts) ? resolved.fonts : [];
    resolved.fonts = mergeFontLists(FONT_PRESETS, serverFonts);
    return resolved;
  }

  function loadStoredJson(key, fallbackValue) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return fallbackValue;
      const parsed = JSON.parse(raw);
      return parsed && typeof parsed === 'object' ? parsed : fallbackValue;
    } catch (err) {
      try { localStorage.removeItem(key); } catch (removeErr) {}
      return fallbackValue;
    }
  }

  function loadStoredLevel(key, fallbackValue) {
    const fallback = parseInt(fallbackValue, 10) || 3;
    try {
      const raw = localStorage.getItem(key);
      const parsed = parseInt(raw || String(fallback), 10);
      const normalized = (!isNaN(parsed) && parsed >= 1 && parsed <= 5) ? parsed : fallback;
      if (String(raw || '') !== String(normalized)) {
        localStorage.setItem(key, String(normalized));
      }
      return normalized;
    } catch (err) {
      return fallback;
    }
  }

  function loadStoredString(key, fallbackValue) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallbackValue : String(raw);
    } catch (err) {
      return fallbackValue;
    }
  }

  function loadStoredInteger(key, fallbackValue, minValue, maxValue) {
    const fallback = parseInt(fallbackValue, 10);
    const safeFallback = isNaN(fallback) ? 0 : fallback;
    try {
      const raw = localStorage.getItem(key);
      const parsed = parseInt(raw == null ? String(safeFallback) : raw, 10);
      let normalized = isNaN(parsed) ? safeFallback : parsed;
      if (typeof minValue === 'number') normalized = Math.max(minValue, normalized);
      if (typeof maxValue === 'number') normalized = Math.min(maxValue, normalized);
      if (String(raw || '') !== String(normalized)) {
        localStorage.setItem(key, String(normalized));
      }
      return normalized;
    } catch (err) {
      return safeFallback;
    }
  }

  function saveStoredString(key, value) {
    try {
      localStorage.setItem(key, String(value));
      return true;
    } catch (err) {
      return false;
    }
  }

  function saveStoredJson(key, value) {

    link.href = objectUrl;

        grid.classList.remove('is-sidebar-collapsed', 'is-sidebar-compact', 'is-sidebar-tight', 'is-sidebar-ultra', 'is-sidebar-micro', 'is-pane-resize-disabled', 'is-viewer-pane-resizing');

    loadSongs: function(shouldRoute, callback, options) {
      if (typeof shouldRoute === 'function') {
        options = callback;
        callback = shouldRoute;
        shouldRoute = false;
      }
      if (typeof shouldRoute === 'undefined') shouldRoute = false;
      options = options || {};

      if (!options.skipBusy) this.beginBusy(options.busyMessage || 'Loading songs…');

      google.script.run
        .withSuccessHandler(function(items) {
          App.state.songs = items || [];
          App.filterSongs(false);
          google.script.run
            .withSuccessHandler(function(setlists) {
              App.state.setlists = (Array.isArray(setlists) ? setlists : []).map(normalizeSetlistForApp);

              if (shouldRoute) {
                var initialQuery = App.parseQueryFromLocation();
                if (!initialQuery.page && !initialQuery.slug && !initialQuery.id) {
                  initialQuery = window.__INITIAL_QUERY__ || {};
                }
                App.routeFromQuery(initialQuery, { skipBusy: true, endBusyOnDone: true });
                return;
              }

              if (!options.skipBusy) App.endBusy();
              if (typeof callback === 'function') callback();
            })
            .withFailureHandler(function(err) {
              App.endBusy();
              App.setStatus('error', getStatusMessage(err, 'Failed to load setlists.'));
              App.render();
            })
            .listSetlists();
        })
        .withFailureHandler(function(err) {
          App.endBusy();
          App.setStatus('error', getStatusMessage(err, 'Failed to load songs.'));
          App.render();
        })
        .listSongs();
    },

    routeFromQuery: function(query, options) {
      options = options || {};
      if (query && query.page === 'setlists') {
        this.showSetlists(options);
        return;
      }
      if (query && query.page === 'setlist-edit') {
        this.openSetlistEditor(query.id || '', options);
        return;
      }
      if (query && query.page === 'setlist-view' && query.id) {
        this.openSetlistSong(query.id, query.index || 0, Object.assign({}, options, {
          returnPage: 'songs',
          urlTranspose: query.key,
          urlNotation: query.sign
        }));
        return;
      }
      if (query && query.page === 'view' && query.slug) {
        this.openSong(query.slug, Object.assign({}, options, {
          urlTranspose: query.key,
          urlNotation: query.sign
        }));
        return;
      }
      if (query && query.page === 'edit') {
        if (query.slug) {
          this.openEditor(query.slug, options);
        } else {
          this.openEditor('', options);
        }
        return;
      }
      this.showList(options);
    },

    filterSongs: function(shouldRender, options) {
      if (typeof shouldRender === 'undefined') shouldRender = true;
      options = options || {};
      const search = String(this.state.searchText || '').trim().toLowerCase();
      const baseSongs = this.state.dedupeMode ? this.getDuplicateTitleSongs(this.state.songs) : this.state.songs;
      if (!search) {
        this.state.filteredSongs = baseSongs.slice();
      } else {
        this.state.filteredSongs = baseSongs.filter(function(song) {
          return App.matchesSongSearch(song, search);
        });
      }
      if (!shouldRender) return;
      if (options.partialListUpdate && this.state.page === 'list') {
        this.updateListSearchResults();
        return;
      }
      this.render();
    },

    normalizeDedupeTitleKey: function(song) {
      return String(song && song.title || '').trim();
    },

    getDuplicateTitleSongs: function(songs) {
      songs = Array.isArray(songs) ? songs : [];
      const counts = Object.create(null);
      songs.forEach(function(song) {
        const key = App.normalizeDedupeTitleKey(song);
        if (!key) return;
        counts[key] = (counts[key] || 0) + 1;
      });
      return songs.filter(function(song) {
        const key = App.normalizeDedupeTitleKey(song);
        return key && counts[key] > 1;
      }).sort(function(a, b) {
        const titleCompare = App.normalizeDedupeTitleKey(a).localeCompare(App.normalizeDedupeTitleKey(b));
        if (titleCompare) return titleCompare;
        const artistCompare = String(a && a.artist || '').localeCompare(String(b && b.artist || ''));
        if (artistCompare) return artistCompare;
        return String(a && a.slug || '').localeCompare(String(b && b.slug || ''));
      });
    },

    matchesSongSearch: function(song, search) {
      const haystack = [song && song.title, song && song.artist].concat(song && song.tags || []).join(' ').toLowerCase();
      return haystack.indexOf(search) !== -1;
    },

    toggleDedupeMode: function() {
      if (!this.state.dedupeMode) {
        this.showDuplicateTitlesFromMaintenance();
        return;
      }
      this.state.dedupeMode = false;
      this.filterSongs(true);
    },

    showDuplicateTitlesFromMaintenance: function() {
      this.state.dedupeMode = true;
      this.filterSongs(false);
      this.showList({ keepStatus: true });
    },

    showMaintenanceMenuDialog: function() {

        const overlay = document.createElement('div');

        overlay.innerHTML = [
          '<div class="choice-dialog panel maintenance-menu-dialog">',
            '<div class="maintenance-menu-header">',
              '<h3 id="' + dialogId + '">Maintenance</h3>',

    rebuildSlugsFromTitles: async function() {

        confirmText: 'Rebuild',

      });
      if (!confirmed) return;
      this.beginBusy('Rebuilding slugs…');
      try {
        const result = await ChordProStorage.rebuildSlugsFromTitles();
        if (result && result.slugMap && !result.notesMigratedInStorage && window.ChordProStorage && ChordProStorage.rebuildNoteSlugsFromMapSync) {
          const noteResult = await ChordProStorage.rebuildNoteSlugsFromMapSync(result.slugMap);
          if (noteResult && noteResult.ok === false) {
            throw noteResult.error || new Error('Slugs were rebuilt, but notes could not be updated.');
          }
        }
        this.state.currentSong = null;
        this.state.editorSong = null;
        this.state.editorReturn = null;
        this.state.currentSetlist = null;
        this.state.missingSetlistSong = null;
        this.state.setlistEditor = null;

    },

    getDuplicateTitleSongsForPayload: function(payload, extraSong) {
      const title = String(payload && payload.title || '').trim();
      if (!title) return [];
      const originalSlug = String(payload && payload.originalSlug || '').trim();
      const nextSlug = String(payload && payload.slug || '').trim();
      const bySlug = Object.create(null);
      const addSong = function(song) {
        const slug = String(song && song.slug || '').trim();
        if (!slug || slug === originalSlug || slug === nextSlug || bySlug[slug]) return;
        if (String(song && song.title || '').trim() !== title) return;
        bySlug[slug] = song;
      };
      (this.state.songs || []).forEach(addSong);
      if (this.state.setlistSongSummaries) {
        Object.keys(this.state.setlistSongSummaries).forEach((summarySlug) => addSong(this.state.setlistSongSummaries[summarySlug]));
      }
      addSong(extraSong);
      return Object.keys(bySlug).map(function(slug) {
        return bySlug[slug];
      }).sort(function(a, b) {
        const artistCompare = String(a && a.artist || '').localeCompare(String(b && b.artist || ''));
        if (artistCompare) return artistCompare;
        return String(a && a.slug || '').localeCompare(String(b && b.slug || ''));
      });
    },

    getDuplicateTitleSongForPayload: function(payload) {
      return this.getDuplicateTitleSongsForPayload(payload)[0] || null;
    },

    getSlugConflictBase: function(slug) {
      const normalizedSlug = String(slug || '').trim();
      return normalizedSlug;
    },

    getSlugConflictSuffixNumber: function(slug, baseSlug) {
      const normalizedSlug = String(slug || '').trim();
      const normalizedBase = String(baseSlug || '').trim();
      if (!normalizedSlug || !normalizedBase) return 0;
      if (normalizedSlug === normalizedBase) return 0;
      const suffix = normalizedSlug.slice(normalizedBase.length).replace(/^-/, '');
      return /^\d+$/.test(suffix) ? parseInt(suffix, 10) : Number.MAX_SAFE_INTEGER;
    },

    getSlugConflictSongs: function(slug, excludeSlug, extraSong) {
      const baseSlug = this.getSlugConflictBase(slug);
      if (!baseSlug) return [];
      const exclude = String(excludeSlug || '').trim();
      const bySlug = Object.create(null);
      const addSong = function(song) {
        const songSlug = String(song && song.slug || '').trim();
        if (!songSlug || songSlug === exclude || songSlug.indexOf(baseSlug) !== 0 || bySlug[songSlug]) return;
        bySlug[songSlug] = song;
      };
      (this.state.songs || []).forEach(addSong);
      if (this.state.setlistSongSummaries) {
        Object.keys(this.state.setlistSongSummaries).forEach((summarySlug) => addSong(this.state.setlistSongSummaries[summarySlug]));
      }
      addSong(extraSong);
      return Object.keys(bySlug).map(function(songSlug) {
        return bySlug[songSlug];
      }).sort((a, b) => {
        const aSuffix = this.getSlugConflictSuffixNumber(a && a.slug, baseSlug);
        const bSuffix = this.getSlugConflictSuffixNumber(b && b.slug, baseSlug);
        if (aSuffix !== bSuffix) return aSuffix - bSuffix;
        return String(a && a.slug || '').localeCompare(String(b && b.slug || ''));
      });
    },

              const label = String(action && action.label || action && action.value || '');

              return '<button class="' + escapeHtml(className) + '" type="button" data-choice-value="' + escapeHtml(value) + '">' + escapeHtml(label) + '</button>';
            }).join('') + '</div>',
          '</div>'
        ].join('');

        let done = false;

        overlay.addEventListener('click', function(event) {
          const button = event.target && event.target.closest ? event.target.closest('[data-choice-value]') : null;
          if (!button) return;

            || overlay.querySelector('[data-choice-value]');

    confirmDuplicateSlugSave: function(existingSong, payload) {
      const song = existingSong || {};
      const slug = String(payload && payload.slug || song.slug || '').trim();
      const existingSlug = String(song.slug || slug || '').trim();
      const originalSlug = String(payload && payload.originalSlug || '').trim();
      const isRenameCollision = !!(originalSlug && slug && originalSlug !== slug);
      const conflictSongs = this.getSlugConflictSongs(slug, originalSlug, song);
      const details = [];
      conflictSongs.forEach(function(conflictSong) {
        const conflictSlug = String(conflictSong && conflictSong.slug || '').trim() || '(no slug)';
        const conflictTitle = String(conflictSong && conflictSong.title || '').trim() || '(No title)';
        details.push((existingSlug && conflictSlug === existingSlug ? '*' : '') + conflictSlug + ' — ' + conflictTitle);
      });
      return this.showChoiceDialog({
        dialogId: 'duplicate-slug-dialog-title',
        title: 'A song with this slug already exists.',
        message: isRenameCollision
          ? 'Cancel returns to Edit. Open existing opens the song marked *. Overwrite replaces the song marked * with this edit. This edit\'s settings and sticky notes are kept; the marked song\'s settings and sticky notes are lost.'
          : 'Cancel returns to Edit. Open existing opens the song marked *. Overwrite replaces the song marked * with this edit. The marked song\'s settings and sticky notes will be lost.',
        details: details,
        cancelValue: 'cancel',
        initialFocusValue: 'cancel',
        actions: [
          { value: 'cancel', label: 'Cancel', className: 'btn' },
          slug ? { value: 'open', label: 'Open existing', className: 'btn' } : null,
          { value: 'overwrite', label: 'Overwrite', className: 'btn danger' }

    },

            '</div>',
          '</div>'

          if (input) {

            if (typeof input.focus === 'function') input.focus();
            if (typeof input.select === 'function') input.select();
          }
        });
      });
    },

        title: context.title || 'Untitled setlist',

    openSetlistSong: function(id, index, options) {
      options = options || {};
      const normalizedId = String(id || '').trim();
      const requestedIndex = Math.max(0, parseInt(index, 10) || 0);
      if (!normalizedId) {
        this.flashStatus('error', 'Setlist not found.');
        return;
      }
      if (!options.skipBusy) this.beginBusy(options.busyMessage || 'Opening setlist…');
      google.script.run
        .withSuccessHandler(function(record) {
          const setlist = normalizeSetlistForApp(record);
          if (!setlist || !setlist.id) {
            if (!options.skipBusy || options.endBusyOnDone) App.endBusy();
            App.showSetlists({
              keepStatus: true,
              onDone: function() { App.flashStatus('error', 'Setlist not found.'); }
            });
            return;
          }
          if (!setlist.items.length) {
            if (!options.skipBusy || options.endBusyOnDone) App.endBusy();
            App.flashStatus('error', 'This setlist has no songs.');
            App.showSetlists({ keepStatus: true });
            return;
          }
          const nextIndex = Math.max(0, Math.min(setlist.items.length - 1, requestedIndex));
          const item = setlist.items[nextIndex];
          App.openSong(item.slug, {
            skipBusy: true,
            endBusyOnDone: !options.skipBusy || options.endBusyOnDone,
            urlTranspose: options.urlTranspose,
            urlNotation: options.urlNotation,
            onDone: options.onDone,
            setlistContext: {
              id: setlist.id,
              title: setlist.title,
              items: setlist.items,
              index: nextIndex,
              returnPage: options.returnPage || 'songs'
            }
          });
        })
        .withFailureHandler(function(err) {
          if (!options.skipBusy || options.endBusyOnDone) App.endBusy();
          App.setStatus('error', getStatusMessage(err, 'Failed to open setlist.'));
          App.render();

          title: setlist.title || 'Untitled setlist',
          items: setlist.items,
          index: nextIndex,
          returnPage: options.returnPage || 'songs'
        }

    openAdjacentSetlistSong: function(delta) {

      if (!context || !Array.isArray(context.items) || !context.items.length) return;
      const nextIndex = Math.max(0, Math.min(context.items.length - 1, (parseInt(context.index, 10) || 0) + delta));
      if (nextIndex === context.index) return;
      const item = context.items[nextIndex];
      this.openSong(item.slug, {
        setlistContext: Object.assign({}, context, { index: nextIndex })
      });

    animateViewerScrollTo: function(target, nextTop, durationMs) {
      if (!target) return;
      const finalTop = Math.max(0, nextTop || 0);
      const duration = Math.max(60, parseInt(durationMs, 10) || 140);
      const startTop = target === window
        ? (window.scrollY || window.pageYOffset || 0)
        : (target.scrollTop || 0);
      const delta = finalTop - startTop;
      if (Math.abs(delta) < 1) {
        if (target === window) window.scrollTo(0, finalTop);
        else target.scrollTop = finalTop;
        return;
      }
      const startedAt = performance.now();
      const step = function(now) {
        const progress = Math.min(1, (now - startedAt) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        const currentTop = startTop + (delta * eased);
        if (target === window) window.scrollTo(0, currentTop);
        else target.scrollTop = currentTop;
        if (progress < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    },

      if (this.state.page !== 'view') return;
      if (this.state.scroll && this.state.scroll.isPlaying) {
        Viewer.pauseAutoScroll();

      if (pane && pane.scrollHeight > pane.clientHeight + 1) {

        return;
      }
      this.animateViewerScrollTo(window, 0, 140);

    validateEditorPayloadForSave: function(payload) {
      const slug = String(payload && payload.slug || '').trim();
      if (!slug) {
        this.flashStatus('error', 'Slug is required.');
        this.focusEditorField('edit-slug');
        return false;
      }
      if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) {
        this.flashStatus('error', 'Slug must contain only lowercase letters, numbers, and hyphens.');
        this.focusEditorField('edit-slug');
        return false;
      }
      if (!String(payload && payload.title || '').trim()) {
        this.flashStatus('error', 'Title is required.');
        this.focusEditorField('edit-title');
        return false;
      }
      if (!String(payload && payload.artist || '').trim()) {
        this.flashStatus('error', 'Artist is required.');
        this.focusEditorField('edit-artist');
        return false;
      }
      if (!String(payload && payload.chordPro || '').trim()) {
        this.flashStatus('error', 'ChordPro is required.');
        this.focusEditorField('edit-chordpro');
        return false;
      }
      const youtubeText = String(payload && payload.youtube || '').trim();
      if (youtubeText) {
        try {
          const youtube = window.__PCV_SHARED_NORMALIZERS__.normalizeYouTubeSelection(youtubeText);
          const youtubeLines = youtubeText.split(/\n/).filter(function(line) { return String(line || '').trim(); });
          if (!youtube.length || youtube.length !== youtubeLines.length) throw new Error('Invalid YouTube link or video ID.');
        } catch (err) {
          this.flashStatus('error', getStatusMessage(err, 'Invalid YouTube link or video ID.'));
          this.focusEditorField('edit-youtube');
          return false;
        }
      }
      return true;
    },

    saveCurrentSong: async function() {
      const payload = this.collectEditorPayload();
      if (!this.validateEditorPayloadForSave(payload)) return;
      const originalSlug = String(payload.originalSlug || '').trim();
      const nextSlug = String(payload.slug || '').trim();
      const existingSong = nextSlug && nextSlug !== originalSlug ? this.getSongSummaryBySlug(nextSlug) : null;
      let allowOverwrite = false;
      let allowDuplicateTitle = false;
      let allowReplaceTitle = false;
      let replaceTitleSlug = '';
      if (existingSong) {
        let existingSlugSong = existingSong;
        if (!String(existingSlugSong.title || '').trim() && window.ChordProStorage && ChordProStorage.getSong) {
          try {
            existingSlugSong = await ChordProStorage.getSong(nextSlug) || existingSlugSong;
          } catch (lookupError) {}
        }
        const duplicateSlugChoice = await this.confirmDuplicateSlugSave(existingSlugSong, payload);
        if (duplicateSlugChoice === 'open') {
          this.openSong(String(existingSong.slug || nextSlug || '').trim());
          return;
        }
        if (duplicateSlugChoice !== 'overwrite') return;
        allowOverwrite = true;
      }
      const existingTitleSongs = allowOverwrite ? [] : this.getDuplicateTitleSongsForPayload(payload);
      const existingTitleSong = existingTitleSongs[0] || null;
      if (existingTitleSong) {
        const duplicateChoice = await this.confirmDuplicateTitleSave(existingTitleSong, payload, existingTitleSongs);
        if (duplicateChoice === 'open') {
          this.openSong(String(existingTitleSong.slug || '').trim());
          return;
        }
        if (duplicateChoice === 'replace') {
          replaceTitleSlug = String(existingTitleSong.slug || '').trim();
          if (!replaceTitleSlug) return;
          allowReplaceTitle = true;
          allowDuplicateTitle = true;
        } else {
          if (duplicateChoice !== 'save') return;
          allowDuplicateTitle = true;
        }
      }
      this.beginBusy('Saving song…');
      google.script.run
        .withSuccessHandler(async function(result) {
          let cleanupWarning = '';
          try {
            if (result && result.slugChanged && !result.notesMigratedInStorage && result.originalSlug && result.slug && window.ChordProStorage && ChordProStorage.moveNotesSync) {
              const cleanupResult = await ChordProStorage.moveNotesSync(result.originalSlug, result.slug);
              if (cleanupResult && cleanupResult.ok === false) cleanupWarning = 'Saved, but failed to move sticky notes.';
            }
          } catch (error) {
            cleanupWarning = 'Saved, but failed to move sticky notes: ' + getStatusMessage(error, '');
          }
          const editorReturn = App.state.editorReturn || null;
          App.state.editorReturn = null;
          App.setBusyMessage('Refreshing list…');
          App.loadSongs(function() {
            const showSavedStatus = function() {
              if (cleanupWarning) {
                App.setStatus('error', cleanupWarning);
                App.render();
              } else {
                App.flashStatus('info', 'Saved.');
              }
            };
            App.setBusyMessage('Opening song…');
            if (App.returnFromEditorToView(editorReturn, {
              slug: result.slug,
              skipBusy: true,
              endBusyOnDone: true,
              onDone: showSavedStatus
            })) return;
            App.openSong(result.slug, {
              skipBusy: true,
              endBusyOnDone: true,
              onDone: showSavedStatus
            });
          }, { skipBusy: true });
        })
        .withFailureHandler(function(err) {
          App.endBusy();
          const message = getStatusMessage(err, 'Failed to save.');
          if (App.isTransientStatusMessage(message)) {
            App.flashStatus('error', message);
            return;
          }
          App.setStatus('error', message);
          App.render();
        })
        .saveSong(Object.assign({}, payload, {
          allowOverwrite: allowOverwrite === true,
          allowDuplicateTitle: allowDuplicateTitle === true,
          allowReplaceTitle: allowReplaceTitle === true,
          replaceTitleSlug: replaceTitleSlug
        }));
    },

              App.setStatus('error', cleanupWarning);
              App.render();
            } else {
              App.flashStatus('info', 'Deleted.');
            }
          }, { skipBusy: true });
        })
        .withFailureHandler(function(err) {
          App.endBusy();
          App.setStatus('error', getStatusMessage(err, 'Failed to delete.'));
          App.render();
        })
        .deleteSong(normalizedSlug);
    },

    syncEditorYouTubeSearchButton: function() {

      const wrap = document.getElementById('edit-youtube-search-wrap');
      const youtubeEl = document.getElementById('edit-youtube');
      const hasYouTubeValue = !!String(youtubeEl && youtubeEl.value || '').trim();

      if (!button) return;

    },

    openYouTubeItemInNewTab: function(item) {
      const videoId = String(item && item.id || '').trim();
      if (!videoId) return;
      const start = Math.max(0, parseInt(item && item.start, 10) || 0);
      const url = 'https://www.youtube.com/watch?v=' + encodeURIComponent(videoId) + (start ? '&t=' + start + 's' : '');

    openEditorYouTubeSearch: function() {

      ].filter(Boolean).join(' ');

    openViewerYouTubeSearch: function() {

      const query = [
        String(song && song.title || '').trim(),
        String(song && song.artist || '').trim()
      ].filter(Boolean).join(' ');

    syncViewerYouTubeSaveButton: function() {

      if (!button) return;
      const hasValue = !!String(input && input.value || '').trim();

    restoreViewerYouTubeInputValue: function(value, shouldFocus) {
      const input = document.getElementById('viewer-youtube-link-input');
      if (!input) return;
      input.value = String(value || '');
      if (shouldFocus && typeof input.focus === 'function') input.focus();
      this.syncViewerYouTubeSaveButton();
    },

    saveViewerYouTubeLink: function() {
      if (typeof this.requireEditUnlocked === 'function' && !this.requireEditUnlocked()) return;
      const song = this.state && this.state.currentSong ? this.state.currentSong : null;
      const input = document.getElementById('viewer-youtube-link-input');
      const value = String(input && input.value || '').trim();
      if (!song || !song.slug || !value) {
        this.syncViewerYouTubeSaveButton();
        return;
      }
      this.beginBusy('Saving YouTube link...');
      ChordProStorage.updateSongYouTubeSelection({ slug: song.slug, youtube: value })
        .then(function(result) {
          if (result && result.ok === false) {
            throw new Error(getStatusMessage(result && result.message, 'Failed to save YouTube link.'));
          }
          const nextYouTube = Array.isArray(result && result.youtube) ? result.youtube : [];
          if (!nextYouTube.length) {
            throw new Error('Failed to save YouTube link.');
          }
          if (App.state.currentSong && App.state.currentSong.slug === song.slug) {
            App.state.currentSong.youtube = JSON.parse(JSON.stringify(nextYouTube));
          }
          App.closeYouTubePlayback();
          App.endBusy();
          App.flashStatus('info', 'YouTube link saved.');
        })
        .catch(function(err) {
          App.endBusy();
          App.setStatus('error', getStatusMessage(err, 'Failed to save YouTube link.'));
          App.render();
          window.requestAnimationFrame(function() {
            App.restoreViewerYouTubeInputValue(value, true);
          });
        });
    },

    collectEditorPayload: function() {
      const titleEl = document.getElementById('edit-title');
      const artistEl = document.getElementById('edit-artist');
      const slugEl = document.getElementById('edit-slug');
      const tagsEl = document.getElementById('edit-tags');
      const originalSlugEl = document.getElementById('edit-original-slug');
      const youtubeEl = document.getElementById('edit-youtube');
      const chordProEl = document.getElementById('edit-chordpro');
      const scrollStartEl = document.getElementById('edit-scroll-start');
      const scrollEndEl = document.getElementById('edit-scroll-end');
      const scrollDurationEl = document.getElementById('edit-scroll-duration');
      const scrollMinutesEl = document.getElementById('edit-scroll-minutes');
      const scrollSecondsEl = document.getElementById('edit-scroll-seconds');
      const transposeEl = document.getElementById('edit-transpose');
      const notationEl = document.getElementById('edit-notation');
      const scrollStartRaw = scrollStartEl ? parseFloat(scrollStartEl.value) : 0;
      const scrollEndRaw = scrollEndEl ? parseFloat(scrollEndEl.value) : 100;
      const scrollStartPercent = Number.isFinite(scrollStartRaw) ? Math.max(0, Math.min(100, scrollStartRaw)) / 100 : 0;
      const scrollEndPercent = Number.isFinite(scrollEndRaw) ? Math.max(0, Math.min(100, scrollEndRaw)) / 100 : 1;
      const scrollMinutesRaw = scrollMinutesEl ? parseInt(scrollMinutesEl.value, 10) : NaN;
      const scrollSecondsRaw = scrollSecondsEl ? parseInt(scrollSecondsEl.value, 10) : NaN;
      const scrollDurationSec = (scrollMinutesEl || scrollSecondsEl)
        ? Math.max(1, (Number.isFinite(scrollMinutesRaw) ? Math.max(0, scrollMinutesRaw) : 0) * 60 + (Number.isFinite(scrollSecondsRaw) ? Math.max(0, Math.min(59, scrollSecondsRaw)) : 0))
        : (scrollDurationEl ? Math.max(1, parseInt(scrollDurationEl.value, 10) || 240) : 240);
      const existing = this.state && this.state.editorSong ? this.state.editorSong : {};
      return {
        title: titleEl ? titleEl.value : '',
        artist: artistEl ? artistEl.value : '',
        originalSlug: originalSlugEl ? originalSlugEl.value : '',
        slug: slugEl ? slugEl.value : '',
        tags: tagsEl ? tagsEl.value : '',
        youtube: youtubeEl ? youtubeEl.value : '',
        chordPro: chordProEl ? chordProEl.value : '',
        scrollStartPercent: scrollStartPercent,
        scrollEndPercent: scrollEndPercent,
        scrollDurationSec: scrollDurationSec,
        transpose: normalizeStoredTranspose(transposeEl ? transposeEl.value : existing.transpose, 0),
        notation: normalizeStoredNotation(notationEl ? notationEl.value : existing.notation, 'default')
      };
    },

    editorInputChanged: function() {
      if (this.state.page !== 'edit') return;
      this.state.editorSong = this.collectEditorPayload();
      this.syncEditorYouTubeSearchButton();
      if (typeof Editor !== 'undefined' && typeof Editor.updateLivePreview === 'function') {
        Editor.updateLivePreview();
      }
    },

    editorSlugChanged: function() {
      const slugEl = document.getElementById('edit-slug');
      if (slugEl) {
        slugEl.setAttribute('data-slug-manual', '1');
        slugEl.removeAttribute('data-auto-slug');
      }
      this.editorInputChanged();
    },

    editorTitleChanged: function() {
      const titleEl = document.getElementById('edit-title');
      this.syncEditorSlugFromTitle(titleEl ? titleEl.value : '');
      this.editorInputChanged();
    },

    syncEditorSlugFromTitle: function(titleValue) {
      const slugEl = document.getElementById('edit-slug');
      if (!slugEl || slugEl.getAttribute('data-slug-manual') === '1') return;
      const nextSlug = this.slugify(titleValue);
      if (!nextSlug) return;
      const previousAutoSlug = slugEl.getAttribute('data-auto-slug') || '';
      if (!slugEl.value || slugEl.value === previousAutoSlug) {
        slugEl.value = nextSlug;
        slugEl.setAttribute('data-auto-slug', nextSlug);
        slugEl.setAttribute('data-slug-manual', '0');
      }
    },

    editorChordProChanged: function() {
      const chordProEl = document.getElementById('edit-chordpro');
      if (!chordProEl) return;
      const chordPro = chordProEl.value;
      const titleValue = findChordProDirectiveValue(chordPro, ['title', 't']);
      const subtitleValue = findChordProDirectiveValue(chordPro, ['subtitle', 'st']);
      const titleEl = document.getElementById('edit-title');
      const artistEl = document.getElementById('edit-artist');
      if (titleValue && titleEl) titleEl.value = titleValue;
      if (subtitleValue && artistEl) artistEl.value = subtitleValue;
      if (titleValue) this.syncEditorSlugFromTitle(titleValue);
      this.editorInputChanged();
    },

    slugify: function(value) {
      return window.__PCV_SHARED_NORMALIZERS__.buildSlug(value);
    },

    getStatusIconName: function(type, message) {
      const text = String(message || '').toLowerCase();
      if (type === 'error') return 'error';
      if (type === 'warning') return 'warning';
      if (text.indexOf('deleted') !== -1) return 'delete';
      if (text.indexOf('imported') !== -1) return 'file_upload';
      if (text.indexOf('exported') !== -1) return 'file_download';
      if (text.indexOf('copied') !== -1 || text.indexOf('ready to copy') !== -1) return 'content_copy';
      if (text.indexOf('locked') !== -1) return text.indexOf('unlocked') !== -1 ? 'lock_open' : 'lock';
      if (text.indexOf('loaded into the editor') !== -1) return 'edit';
      if (text.indexOf('rebuilt') !== -1) return 'sync';
      return 'check_circle';
    },

    renderStatusHtml: function(extraClass) {
      const status = this.status || {};
      if (!status.message) return '';
      const typeClass = status.type === 'error' ? ' error' : (status.type === 'warning' ? ' warning' : '');
      const hidingClass = status.hiding ? ' is-hiding' : '';
      const extra = extraClass ? ' ' + escapeHtml(extraClass) : '';
      const icon = this.getStatusIconName(status.type, status.message);
      return '<div class="status-box' + extra + typeClass + hidingClass + '" role="status" aria-live="polite"><span class="status-icon material-symbols-outlined" aria-hidden="true">' + escapeHtml(icon) + '</span><span class="status-message">' + escapeHtml(status.message) + '</span></div>';
    },

    setStatus: function(type, message, options) {
      options = options || {};
      const normalizedMessage = getStatusMessage(message, '');
      if (this._statusTimer) {
        clearTimeout(this._statusTimer);
        this._statusTimer = null;
      }
      if (this._statusHideTimer) {
        clearTimeout(this._statusHideTimer);
        this._statusHideTimer = null;
      }
      this.status = { type: type, message: normalizedMessage, hiding: false };
      if (normalizedMessage && !options.persistent) {
        this.scheduleStatusClear(normalizedMessage, options.durationMs);
      }
    },

    clearStatus: function() {
      if (this._statusTimer) {
        clearTimeout(this._statusTimer);
        this._statusTimer = null;
      }
      if (this._statusHideTimer) {
        clearTimeout(this._statusHideTimer);
        this._statusHideTimer = null;
      }
      this.status = { type: '', message: '' };
    },

    scheduleStatusClear: function(expectedMessage, durationMs) {
      this._statusTimer = window.setTimeout(function() {
        App._statusTimer = null;
        if (App.status && App.status.message === expectedMessage) {
          App.status.hiding = true;
          App.render();
          App._statusHideTimer = window.setTimeout(function() {
            App._statusHideTimer = null;
            if (App.status && App.status.message === expectedMessage && App.status.hiding) {
              App.clearStatus();
              App.render();
            }
          }, 180);
        }
      }, typeof durationMs === 'number' ? durationMs : 2000);
    },

    flashStatus: function(type, message, durationMs) {
      const expectedMessage = getStatusMessage(message, '');
      this.setStatus(type, expectedMessage, { persistent: true });
      this.render();
      this.scheduleStatusClear(expectedMessage, durationMs);
    },

    isTransientStatusMessage: function(message) {
      const text = getStatusMessage(message, '');
      return /^(slug is required|slug must contain|title is required|artist is required|chordpro is required|setlist title is required|delete is available only|this setlist has no songs|song not found\.|setlist not found\.|no current song|note import input not found\.|invalid .*json file\.)/i.test(text);
    },

    startSearchComposition: function() {
      this._isSearchComposing = true;
    },

    endSearchComposition: function(input) {
      this._isSearchComposing = false;
      this.state.searchDraft = input ? input.value : String(this.state.searchDraft || '');
      this.changeSearch(this.state.searchDraft, { partialListUpdate: true });
    },

    handleSearchInput: function(event, input) {
      this.state.searchDraft = input ? input.value : '';
      if (this._isSearchComposing || (event && (event.isComposing || event.inputType === 'insertCompositionText'))) return;
      this.changeSearch(this.state.searchDraft, { partialListUpdate: true });
    },

    handleSearchKeyDown: function(event, input) {
      if (!event) return;
      if (event.key !== 'Enter') return;
      if (this._isSearchComposing || event.isComposing || event.keyCode === 229) return;
      event.preventDefault();
      this.submitSearch(input);
    },

    submitSearch: function(input) {
      this._isSearchComposing = false;
      const value = input ? input.value : String(this.state.searchDraft || this.state.searchText || '');
      this.state.searchDraft = value;
      this.changeSearch(value, { partialListUpdate: true });
    },

    changeSearch: function(value, options) {
      options = options || {};
      this.state.searchText = value;
      this.state.searchDraft = value;
      this.filterSongs(true, { partialListUpdate: !!options.partialListUpdate });
    },

    clearSearch: function() {
      this._isSearchComposing = false;
      this.state.searchText = '';
      this.state.searchDraft = '';
      this.filterSongs(true, { partialListUpdate: true });
      window.requestAnimationFrame(function() {
        const input = document.getElementById('list-search-input');
        if (!input) return;
        input.value = '';
        try {
          input.focus({ preventScroll: true });
        } catch (err) {
          input.focus();
        }
      });
    },

    restoreListSearchFocusIfNeeded: function() {
      const pending = this._pendingSearchFocus;
      this._pendingSearchFocus = null;
      if (!pending) return;
      window.requestAnimationFrame(function() {
        const input = document.getElementById('list-search-input');
        if (!input) return;
        input.focus({ preventScroll: true });
        const len = input.value.length;
        const start = Math.max(0, Math.min(typeof pending.start === 'number' ? pending.start : len, len));
        const end = Math.max(start, Math.min(typeof pending.end === 'number' ? pending.end : start, len));
        try {
          input.setSelectionRange(start, end);
        } catch (err) {}
      });
    },

    updateListSearchResults: function() {
      const list = document.querySelector('.song-list');
      if (!list || this.state.page !== 'list') {
        this.render();
        return;
      }
      list.innerHTML = this.renderVisibleSongListHtml();
    },


    restoreViewerInputFocusIfNeeded: function() {
      const pending = this._pendingViewerInputFocus;
      this._pendingViewerInputFocus = null;
      if (!pending || !pending.id) return;
      window.requestAnimationFrame(function() {
        const input = document.getElementById(pending.id);
        if (!input) return;
        try {
          input.focus({ preventScroll: true });
        } catch (err) {
          input.focus();
        }
        const len = String(input.value || '').length;
        try {
          input.setSelectionRange(len, len);
        } catch (err) {}
      });
    },

    sanitizeIntegerText: function(value, allowNegative) {
      let text = String(value ?? '');
      if (allowNegative) {
        text = text.replace(/[^\d-]/g, '');
        const hasLeadingMinus = text.charAt(0) === '-';
        text = (hasLeadingMinus ? '-' : '') + text.replace(/-/g, '');
      } else {
        text = text.replace(/\D+/g, '');
      }
      return text;
    },

    normalizeTransposeNumber: function(value) {
      const cleaned = this.sanitizeIntegerText(value, true);
      if (cleaned === '' || cleaned === '-') return null;
      let num = parseInt(cleaned, 10);
      if (isNaN(num)) num = 0;
      return Math.max(-11, Math.min(11, num));
    },

    normalizeMinutesNumber: function(value) {
      const cleaned = this.sanitizeIntegerText(value, false);
      if (cleaned === '') return null;
      let num = parseInt(cleaned, 10);
      if (isNaN(num)) num = 0;
      return Math.max(0, num);
    },

    normalizeSecondsNumber: function(value) {
      const cleaned = this.sanitizeIntegerText(value, false);
      if (cleaned === '') return null;
      let num = parseInt(cleaned, 10);
      if (isNaN(num)) num = 0;
      return Math.max(0, Math.min(59, num));
    },

    clearPendingObservedScrollDurationUi: function() {
      ['scroll-minutes-input', 'scroll-seconds-input'].forEach(function(id) {
        const input = document.getElementById(id);
        if (input) input.classList.remove('is-observed-pending');
      });
    },

    activatePendingObservedScrollDuration: function() {
      if (!this.state.scroll.isObservedDurationPending) return false;
      const next = Math.max(1, parseInt(this.state.scroll.pendingObservedDurationSec, 10) || 0);
      if (!next) {
        this.clearPendingObservedScrollDuration();
        return false;
      }
      this.state.scroll.durationSec = next;
      this.clearPendingObservedScrollDuration();
      this.refreshRunningAutoscrollTiming();
      return true;
    },

    clearPendingObservedScrollDuration: function() {
      this.state.scroll.pendingObservedDurationSec = null;
      this.state.scroll.isObservedDurationPending = false;
      this.clearPendingObservedScrollDurationUi();
    },

    setPendingObservedScrollDuration: function(totalSeconds) {
      const next = Math.max(1, parseInt(totalSeconds, 10) || 0);
      if (!next) return false;
      this.state.scroll.pendingObservedDurationSec = next;
      this.state.scroll.isObservedDurationPending = true;
      return true;
    },


    getDisplayedScrollDurationSec: function() {
      if (this.state.scroll.isObservedDurationPending) {
        const pending = Math.max(1, parseInt(this.state.scroll.pendingObservedDurationSec, 10) || 0);
        if (pending) return pending;
      }
      return Math.max(1, parseInt(this.state.scroll.durationSec, 10) || 240);
    },

    getViewerSongControlsSnapshot: function() {
      const scroll = this.state.scroll || {};
      return {
        transpose: normalizeStoredTranspose(this.state.transpose, 0),
        notation: normalizeStoredNotation(this.state.notation, 'default'),
        scrollStartPercent: Math.round((parseFloat(scroll.startPercent) || 0) * 1000000) / 1000000,
        scrollEndPercent: Math.round((parseFloat(scroll.endPercent) || 0) * 1000000) / 1000000,
        scrollDurationSec: Math.max(1, parseInt(this.getDisplayedScrollDurationSec(), 10) || 240)
      };
    },

    captureViewerSongControlsBaseline: function() {
      this.state.viewerSongControlsBaseline = this.getViewerSongControlsSnapshot();
    },

    isViewerSongControlsDirty: function() {
      const baseline = this.state.viewerSongControlsBaseline;
      if (!baseline || !this.state.currentSong) return false;
      const current = this.getViewerSongControlsSnapshot();
      return current.transpose !== baseline.transpose
        || current.notation !== baseline.notation
        || current.scrollStartPercent !== baseline.scrollStartPercent
        || current.scrollEndPercent !== baseline.scrollEndPercent
        || current.scrollDurationSec !== baseline.scrollDurationSec;
    },

    syncViewerSongControlsSaveButtons: function() {
      const isDirty = this.isViewerSongControlsDirty();
      Array.from(document.querySelectorAll('.btn-save-autoscroll')).forEach(function(button) {
        button.classList.toggle('is-dirty', isDirty);
      });
    },

    handleTransposeInput: function(input) {
      if (!input) return;
      const cleaned = this.sanitizeIntegerText(input.value, true);
      if (cleaned === '' || cleaned === '-') {
        input.value = cleaned;
        return;
      }
      const num = this.normalizeTransposeNumber(cleaned);
      input.value = String(num === null ? 0 : num);
    },

    handleScrollMinutesInput: function(input) {
      if (!input) return;
      this.activatePendingObservedScrollDuration();
      const cleaned = this.sanitizeIntegerText(input.value, false);
      if (cleaned === '') {
        input.value = '';
        return;
      }
      const minutes = this.normalizeMinutesNumber(cleaned);
      input.value = String(minutes === null ? 0 : minutes);
    },

    handleScrollSecondsInput: function(input) {
      if (!input) return;
      this.activatePendingObservedScrollDuration();
      input.value = this.sanitizeIntegerText(input.value, false);
    },

    closeYouTubePlayback: function() {
      this.state.playingYtIdx = null;
      this._forceYoutubeRefresh = false;
    },

    refreshViewerSheetOrRender: function(options) {
      options = options || {};
      const currentSong = this.state.currentSong;
      const canRefreshViewer = this.state.page === 'view' && currentSong && (!options.requireSlug || currentSong.slug);
      if (!canRefreshViewer) {
        this.render();
        return false;
      }
      if (options.updateUrl) this.updateCurrentViewUrl();
      this.refreshViewerSheetDisplay();
      return true;
    },

    refreshViewerSheetDisplay: function() {
      if (this.state.page !== 'view' || !this.state.currentSong) {
        this.render();
        return;
      }
      const sheet = document.querySelector('#sheet-stage .cw-sheet');
      const stage = document.getElementById('sheet-stage');
      if (!sheet || !stage) {
        this.render();
        return;
      }
      const viewerScrollTop = typeof Viewer !== 'undefined' && typeof Viewer.getRenderScrollTop === 'function'
        ? Viewer.getRenderScrollTop()
        : 0;
      sheet.innerHTML = renderChordPro(this.state.currentSong.chordPro, {
        transpose: this.state.transpose,
        notation: this.state.notation,
        fontSizeLevel: this.state.fontSizeLevel,
        chordSizeLevel: this.state.chordSizeLevel,
        formatOptions: this.state.formatOptions,
        lyricsFont: this.getLyricsFontStack(),
        chordFont: this.getChordFontStack()
      });
      if (typeof applyPersonalChordProViewerTypography === 'function') {
        applyPersonalChordProViewerTypography(sheet);
      }

      this.refreshViewerSidebarControls();
      if (typeof Viewer !== 'undefined' && typeof Viewer.afterRender === 'function') {
        Viewer.afterRender({ viewerScrollTop: viewerScrollTop });
      }
    },


    refreshViewerSidebarControls: function() {
      if (this.state.page !== 'view') return;
      const sizeText = function(value) {
        if (typeof sizeLabel === 'function') return sizeLabel(value);
        return String(value || '');
      };
      const updateStepper = function(actionName, value, min, max) {
        const down = document.querySelector('[data-app-action="' + actionName + '"][data-app-delta="-1"]');
        const up = document.querySelector('[data-app-action="' + actionName + '"][data-app-delta="1"]');
        const stepper = (down && down.closest ? down.closest('.stepper') : null) || (up && up.closest ? up.closest('.stepper') : null);
        const valueEl = stepper && stepper.querySelector ? stepper.querySelector('.stepper-value') : null;
        if (down) down.disabled = value <= min;
        if (up) up.disabled = value >= max;
        if (valueEl) valueEl.textContent = sizeText(value);
      };
      updateStepper('change-font-size', this.state.fontSizeLevel, 1, 5);
      updateStepper('change-chord-size', this.state.chordSizeLevel, 1, 5);

      const lyricsFontSelect = document.querySelector('select[data-app-change="lyrics-font"]');
      if (lyricsFontSelect) lyricsFontSelect.value = this.state.lyricsFont;
      const chordFontSelect = document.querySelector('select[data-app-change="chord-font"]');
      if (chordFontSelect) chordFontSelect.value = this.state.chordFont;

      document.querySelectorAll('[data-app-change="format-option"]').forEach(function(input) {
        const key = input.getAttribute('data-format-key') || '';
        if (!key) return;
        input.checked = !!App.state.formatOptions[key];
      });

      const updateChipGroup = function(actionName, currentValue) {
        document.querySelectorAll('[data-app-action="' + actionName + '"]').forEach(function(button) {
          const value = button.getAttribute('data-app-value') || '';
          const active = value === currentValue;
          button.classList.toggle('is-active', active);
          button.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
      };
      updateChipGroup('set-accent-color', this.state.accentColor);
      updateChipGroup('set-note-color', this.state.noteColor);
      updateChipGroup('set-bpm-blink-color', normalizeBpmBlinkColor(this.state.formatOptions && this.state.formatOptions.bpmBlinkColor));

      const transposeInput = document.getElementById('transpose-input');
      if (transposeInput) transposeInput.value = String(this.state.transpose);
      const transposeDown = document.querySelector('[data-app-action="change-transpose"][data-app-delta="-1"]');
      const transposeUp = document.querySelector('[data-app-action="change-transpose"][data-app-delta="1"]');
      if (transposeDown) transposeDown.disabled = this.state.transpose <= -11;
      if (transposeUp) transposeUp.disabled = this.state.transpose >= 11;

      document.querySelectorAll('[data-app-action="set-notation"]').forEach(function(button) {
        const value = button.getAttribute('data-app-value') || 'default';
        button.classList.toggle('is-active', value === App.state.notation);
      });

      const minutesInput = document.getElementById('scroll-minutes-input');
      const secondsInput = document.getElementById('scroll-seconds-input');
      const isObservedDurationPending = !!this.state.scroll.isObservedDurationPending;
      const displayedDurationSec = Math.max(1, parseInt(this.getDisplayedScrollDurationSec(), 10) || 240);
      const displayedMinutes = Math.floor(displayedDurationSec / 60);
      const displayedSeconds = displayedDurationSec % 60;
      if (minutesInput) {
        minutesInput.value = String(displayedMinutes);
        minutesInput.classList.toggle('is-observed-pending', isObservedDurationPending);
      }
      if (secondsInput) {
        secondsInput.value = String(displayedSeconds).padStart(2, '0');
        secondsInput.classList.toggle('is-observed-pending', isObservedDurationPending);
      }
      this.syncViewerSongControlsSaveButtons();

      const minutesInput = document.getElementById('edit-scroll-minutes');

      const minutes = minutesInput ? this.normalizeMinutesNumber(minutesInput.value) : null;
      const seconds = secondsInput ? this.normalizeSecondsNumber(secondsInput.value) : null;

    stepEditorScrollMinutes: function(delta) {
      const total = this.getEditorScrollDurationSecFromInputs();
      const seconds = total % 60;
      const minutes = Math.max(0, Math.floor(total / 60) + (parseInt(delta, 10) || 0));
      this.setEditorScrollDurationSec((minutes * 60) + seconds);
    },

    stepScrollDurationByRoundedSeconds: function(totalSeconds, delta) {
      const total = Math.max(1, parseInt(totalSeconds, 10) || 1);
      const direction = parseInt(delta, 10) || 0;
      if (direction > 0) {
        return Math.max(1, Math.ceil((total + 1) / 10) * 10);
      }
      if (direction < 0) {
        return Math.max(1, Math.floor((total - 1) / 10) * 10);
      }
      return total;
    },

    stepEditorScrollSeconds: function(delta) {
      const total = this.getEditorScrollDurationSecFromInputs();
      this.setEditorScrollDurationSec(this.stepScrollDurationByRoundedSeconds(total, delta));
    },

    setScrollMinutes: function(value) {

      const minutes = normalized === null ? 0 : normalized;
      const currentSeconds = Math.max(0, Math.min(59, this.getScrollSecondsValue()));
      this.state.scroll.durationSec = Math.max(1, (minutes * 60) + currentSeconds);

    setScrollSecondsPart: function(value) {

      const currentMinutes = Math.max(0, this.getScrollMinutesValue());

    stepScrollSecondsPart: function(delta) {
      this.activatePendingObservedScrollDuration();
      const currentTotal = Math.max(1, parseInt(this.state.scroll.durationSec, 10) || 240);
      this.state.scroll.durationSec = this.stepScrollDurationByRoundedSeconds(currentTotal, delta);
      this.refreshRunningAutoscrollTiming();

    saveViewerScrollSettings: function() {
      var song = this.state.currentSong;
      if (!song || !song.slug) return;
      var savedDurationSec = this.state.scroll.durationSec;
      if (this.state.scroll.isObservedDurationPending) {
        var pending = Math.max(1, parseInt(this.state.scroll.pendingObservedDurationSec, 10) || 0);
        if (pending) savedDurationSec = pending;
      }
      savedDurationSec = Math.max(1, parseInt(savedDurationSec, 10) || 240);
      this.beginBusy('Saving song controls…');
      google.script.run
        .withSuccessHandler(function() {
          App.state.scroll.durationSec = savedDurationSec;
          App.clearPendingObservedScrollDuration();
          App.refreshRunningAutoscrollTiming();
          if (App.state.currentSong && App.state.currentSong.slug === song.slug) {
            App.state.currentSong.scrollStartPercent = App.state.scroll.startPercent;
            App.state.currentSong.scrollEndPercent = App.state.scroll.endPercent;
            App.state.currentSong.scrollDurationSec = savedDurationSec;
            App.state.currentSong.transpose = App.state.transpose;
            App.state.currentSong.notation = App.state.notation;
            App.captureViewerSongControlsBaseline();
          }
          App.endBusy();
          App.flashStatus('info', 'Song controls saved.');
        })
        .withFailureHandler(function(err) {
          App.endBusy();
          App.setStatus('error', getStatusMessage(err, 'Failed to save song controls.'));
          App.render();
        })
        .updateSongControlSettings({
          slug: song.slug,
          scrollStartPercent: App.state.scroll.startPercent,
          scrollEndPercent: App.state.scroll.endPercent,
          scrollDurationSec: savedDurationSec,
          transpose: App.state.transpose,
          notation: App.state.notation
        });
    },


    updateUrl: function(params) {
      const query = new URLSearchParams();
      if (params && params.page && params.page !== 'list') query.set('page', params.page);
      if (params && params.slug) query.set('slug', params.slug);
      if (params && params.id) query.set('id', params.id);
      if (params && typeof params.index !== 'undefined') query.set('index', String(params.index));
      if (params && params.page === 'view' && params.slug) {
        query.set('key', String(this.state.transpose));
        query.set('sign', this.state.notation || 'default');
      }
      if (params && params.page === 'setlist-view') {
        query.set('key', String(this.state.transpose));
        query.set('sign', this.state.notation || 'default');
      }
      const nextUrl = window.location.pathname + (query.toString() ? '?' + query.toString() : '');
      if (window.location.pathname + window.location.search !== nextUrl) {
        window.history.pushState(params || {}, '', nextUrl);
      }
    },

    updateCurrentViewUrl: function() {
      if (this.state.currentSetlist && this.state.currentSetlist.id) {
        this.updateUrl({
          page: 'setlist-view',

        });

        slug: params.get('slug') || '',
        id: params.get('id') || '',

    normalizeGasSyncUrl: function(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      try {
        const url = new URL(raw);
        if (url.protocol !== 'https:') return '';
        url.search = '';
        url.hash = '';
        return url.toString();
      } catch (err) {
        return '';
      }
    },

    forgetGasSyncEditPassword: function() {
      try {
        sessionStorage.removeItem(STORAGE_KEYS.gasSyncEditPasswordSession);
      } catch (err) {}
    },

    getGasSyncUrl: async function(options) {
      options = options || {};
      const forcePrompt = !!options.forcePrompt;
      const rememberedUrl = loadStoredString(STORAGE_KEYS.gasSyncUrl, '');
      let syncUrl = this.normalizeGasSyncUrl(rememberedUrl);
      if (!forcePrompt && syncUrl) return syncUrl;
      const enteredUrl = await this.showInputDialog({
        dialogId: 'gas-sync-url-dialog-title',
        inputId: 'gas-sync-url-input',
        title: syncUrl ? 'Replace GAS web app URL' : 'GAS web app URL',
        message: 'Paste the GAS web app URL.',
        label: 'GAS web app URL',
        initialValue: syncUrl || rememberedUrl || '',
        confirmText: 'Continue'
      });
      if (enteredUrl === null) return null;
      const normalizedUrl = this.normalizeGasSyncUrl(enteredUrl);
      if (!normalizedUrl) {
        this.flashStatus('error', 'Enter a valid GAS web app URL.');
        return null;
      }
      if (!saveStoredString(STORAGE_KEYS.gasSyncUrl, normalizedUrl)) this.notifyStorageUnavailable();
      if (forcePrompt) this.forgetGasSyncEditPassword();
      return normalizedUrl;
    },

    getGasSyncEditPassword: async function(syncUrl) {
      const key = STORAGE_KEYS.gasSyncEditPasswordSession;
      const normalizedUrl = String(syncUrl || '').trim();
      try {
        const cached = sessionStorage.getItem(key);
        if (cached !== null) {
          try {
            const parsed = JSON.parse(cached);
            if (parsed && parsed.syncUrl === normalizedUrl) return String(parsed.editPassword || '');
          } catch (parseErr) {
            sessionStorage.removeItem(key);
          }
        }
      } catch (err) {}
      const editPassword = await this.showInputDialog({
        dialogId: 'gas-sync-password-dialog-title',
        inputId: 'gas-sync-password-input',
        inputType: 'password',
        title: 'Unlock edit password',
        message: 'If edit lock is enabled, enter the Unlock edit password. Leave blank if not used. This will be remembered until this tab is closed.',
        label: 'Unlock edit password',
        initialValue: '',
        confirmText: 'Continue'
      });
      if (editPassword === null) return null;
      try {
        sessionStorage.setItem(key, JSON.stringify({ syncUrl: normalizedUrl, editPassword: String(editPassword) }));
      } catch (err) {}
      return editPassword;
    },

    submitGasLibrarySyncForm: function(syncUrl, songs, setlists, editPassword, targetName, options) {
      options = options || {};
      const form = document.createElement('form');
      form.method = 'post';
      form.action = syncUrl;
      form.target = targetName || '_self';
      form.acceptCharset = 'UTF-8';
      form.style.display = 'none';

      function appendField(name, value, isLarge) {
        const field = isLarge ? document.createElement('textarea') : document.createElement('input');
        field.name = name;
        if (!isLarge) field.type = 'hidden';
        field.value = String(value == null ? '' : value);
        if (isLarge) field.hidden = true;
        form.appendChild(field);
      }

      appendField('syncAction', 'sync-library', false);
      appendField('editPassword', editPassword || '', false);
      appendField('songsJson', JSON.stringify(Array.isArray(songs) ? songs : []), true);
      appendField('setlistsJson', JSON.stringify(Array.isArray(setlists) ? setlists : []), true);
      if (options.openAfterSync) {
        appendField('openAfterSync', '1', false);
        appendField('openPage', options.openPage || 'view', false);
        appendField('openSlug', options.openSlug || '', false);
        appendField('openId', options.openId || '', false);
        appendField('openKey', typeof options.openKey === 'undefined' ? '' : options.openKey, false);
        appendField('openSign', options.openSign || 'default', false);
      }

      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);
    },

    syncLibraryToGas: async function(options) {
      options = options || {};
      const syncUrl = await this.getGasSyncUrl({ forcePrompt: !!options.forceUrlPrompt });
      if (!syncUrl) return false;
      const editPassword = await this.getGasSyncEditPassword(syncUrl);
      if (editPassword === null) return false;

      this.beginBusy('Preparing GAS sync...');
      Promise.all([
        ChordProStorage.getAllSongsFull(),
        ChordProStorage.listSetlists()
      ]).then(function(results) {
        const songs = Array.isArray(results[0]) ? results[0] : [];
        const setlists = (Array.isArray(results[1]) ? results[1] : []).map(normalizeSetlistForApp);
        App.endBusy();
        App.confirmAction({
          dialogId: 'sync-library-to-gas-dialog-title',
          title: 'Send library to GAS?',
          message: 'Send ' + songs.length + ' song(s) and ' + setlists.length + ' setlist(s) to GAS?',
          details: ['Matching slugs / ids in GAS will be overwritten.', 'All other GAS data will be kept.'],
          confirmText: 'Send',
          confirmClassName: 'btn soft-accent'
        }).then(function(confirmed) {
          if (!confirmed) {
            return;
          }
          App.submitGasLibrarySyncForm(syncUrl, songs, setlists, editPassword, '_self');
        });
        return;
      }).catch(function(err) {
        App.endBusy();
        App.setStatus('error', getStatusMessage(err, 'Failed to prepare GAS sync.'));
        App.render();
      });
      return false;
    },

    syncCurrentSongToGas: async function(options) {
      options = options || {};
      const currentSong = this.state && this.state.currentSong ? this.state.currentSong : null;
      const slug = String(currentSong && currentSong.slug || '').trim();
      if (!slug) {
        this.flashStatus('error', 'Song not found.');
        return false;
      }
      const syncUrl = await this.getGasSyncUrl({ forcePrompt: !!options.forceUrlPrompt });
      if (!syncUrl) return false;
      const editPassword = await this.getGasSyncEditPassword(syncUrl);
      if (editPassword === null) return false;

      this.beginBusy('Preparing GAS sync...');
      ChordProStorage.getSong(slug)
        .then(function(song) {
          App.endBusy();
          if (!song || !song.slug) {
            App.setStatus('error', 'Song not found.');
            App.render();
            return;
          }
          const scroll = App.state.scroll || {};
          const songForSync = Object.assign({}, song, {
            scrollStartPercent: normalizeStoredPercent(scroll.startPercent, song.scrollStartPercent),
            scrollEndPercent: normalizeStoredPercent(scroll.endPercent, song.scrollEndPercent),
            scrollDurationSec: normalizeStoredDuration(App.getDisplayedScrollDurationSec(), song.scrollDurationSec),
            transpose: normalizeStoredTranspose(App.state.transpose, song.transpose),
            notation: normalizeStoredNotation(App.state.notation, song.notation || 'default'),
            updatedAt: new Date().toISOString()
          });
          App.submitGasLibrarySyncForm(syncUrl, [songForSync], [], editPassword, '_self', {

            openPage: 'view',
            openSlug: songForSync.slug,
            openKey: songForSync.transpose,
            openSign: songForSync.notation || 'default'
          });
        })
        .catch(function(err) {
          App.endBusy();
          App.setStatus('error', getStatusMessage(err, 'Failed to prepare GAS sync.'));
          App.render();
        });
      return false;
    },

    syncCurrentSetlistToGas: async function(options) {
      options = options || {};
      const setlist = normalizeSetlistForApp(this.state && this.state.setlistEditor ? this.state.setlistEditor : {});
      if (!setlist.id) {
        this.flashStatus('error', 'Setlist not found.');
        return false;
      }
      const syncUrl = await this.getGasSyncUrl({ forcePrompt: !!options.forceUrlPrompt });
      if (!syncUrl) return false;
      const editPassword = await this.getGasSyncEditPassword(syncUrl);
      if (editPassword === null) return false;

      const slugs = [];
      const seen = Object.create(null);
      setlist.items.forEach(function(item) {
        const slug = String(item && item.slug || '').trim();
        if (!slug || seen[slug]) return;
        seen[slug] = true;
        slugs.push(slug);
      });

      this.beginBusy('Preparing GAS sync...');
      Promise.all(slugs.map(function(slug) {
        return ChordProStorage.getSong(slug).catch(function() { return null; });
      })).then(function(songResults) {
        const songs = (Array.isArray(songResults) ? songResults : []).filter(function(song) {
          return !!(song && song.slug);
        });
        const missingCount = Math.max(0, slugs.length - songs.length);
        const setlistForSync = Object.assign({}, setlist, {
          updatedAt: new Date().toISOString()
        });
        App.endBusy();
        const confirmMessage = 'Send this setlist and ' + songs.length + ' song(s) to GAS? Matching slug / id data in GAS will be overwritten, and all other GAS data will be kept.'
          + (missingCount ? ' ' + missingCount + ' missing song(s) will remain as missing entries.' : '');
        App.confirmAction({
          dialogId: 'sync-setlist-to-gas-dialog-title',
          title: 'Send setlist to GAS?',
          message: confirmMessage,
          confirmText: 'Send',

    handleSongLibraryImportChange: function(event) {
      const input = event && event.target ? event.target : null;
      const file = input && input.files && input.files[0] ? input.files[0] : null;
      if (input) input.value = '';
      if (!file) return false;
      const reader = new FileReader();
      reader.onload = async function(loadEvent) {
        try {
          const raw = loadEvent && loadEvent.target ? String(loadEvent.target.result || '') : '';
          const payload = JSON.parse(raw);
          const songs = extractAllSongImportRecords(payload);
          const singleSong = songs.length ? null : extractSingleSongImportRecord(payload);
          if (singleSong) {
            App.state.editorSong = Object.assign({}, singleSong, { originalSlug: '' });
            App.state.page = 'edit';
            App.state.currentSong = null;
            App.state.currentSetlist = null;
            App.state.missingSetlistSong = null;
            App.updateUrl({ page: 'edit' });
            App.clearStatus();
            App.render();
            App.flashStatus('info', 'Song loaded into the editor. Save to import it.');
            return;
          }
          if (!songs.length) {
            App.flashStatus('error', 'Invalid song JSON file.');
            return;
          }
          if (!await App.confirmAction({
            dialogId: 'import-songs-dialog-title',
            title: 'Import songs?',
            message: 'Import ' + songs.length + ' song(s)?',
            details: ['Songs with the same slug will be overwritten.', 'All other existing songs will be kept.'],
            confirmText: 'Import',
            confirmClassName: 'btn soft-accent'
          })) {
            return;
          }
          App.beginBusy('Importing songs…');
          ChordProStorage.importSongs(songs)
            .then(function(result) {
              App.clearStatus();
              App.loadSongs(function() {
                App.showList({ endBusyOnDone: true, keepStatus: true });
                App.flashStatus('info', 'Imported ' + ((result && result.count) || songs.length) + ' song(s).');
              }, { skipBusy: true });
            })
            .catch(function(err) {
              App.endBusy();
              App.setStatus('error', getStatusMessage(err, 'Failed to import songs.'));
              App.render();
            });
        } catch (err) {
          App.flashStatus('error', getStatusMessage(err, 'Failed to read song JSON file.'));
        }
      };
      reader.onerror = function() {
        App.flashStatus('error', 'Failed to read song JSON file.');
      };
      reader.readAsText(file);
      return false;
    },

    exportCurrentEditorSong: function() {

        .some(function(value) { return String(value || '').trim().length > 0; });
      if (!hasContent) {
        this.flashStatus('error', 'Nothing to export on this edit page.');
        return false;
      }
      const fileSlug = String(payload.slug || payload.originalSlug || payload.title || 'song')
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9-]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '') || 'song';
      downloadJsonFile('personal-chordpro-viewer-song-' + fileSlug + '.json', {
        type: 'personal-chordpro-viewer-songs',
        version: 1,
        scope: 'song',
        exportedAt: new Date().toISOString(),
        song: payload
      });
      this.flashStatus('info', 'Song exported.');

    render: function() {
      const app = document.getElementById('app');
      if (!app) return;
      if (this.state.page !== 'view' || !this.state.currentSong) TempoSound.stop();

      const shouldResetViewerScroll = !!this._resetViewerScrollOnNextRender;
      const prevViewerScrollTop = this.state.page === 'view' && !shouldResetViewerScroll
        ? (function() {
            if (typeof Viewer !== 'undefined' && typeof Viewer.getRenderScrollTop === 'function') {
              const viewerScrollTop = Viewer.getRenderScrollTop();
              if (typeof viewerScrollTop === 'number' && isFinite(viewerScrollTop)) return viewerScrollTop;
            }
            const pane = document.getElementById('viewer-scroll-pane');
            if (pane) {
              const overflowY = window.getComputedStyle(pane).overflowY;
              const canPaneScroll = overflowY !== 'visible' && overflowY !== 'clip' && pane.scrollHeight > pane.clientHeight + 1;
              if (canPaneScroll) return pane.scrollTop || 0;
            }
            const scrollRoot = document.scrollingElement || document.documentElement || document.body;
            return scrollRoot ? (scrollRoot.scrollTop || 0) : 0;
          })()
        : 0;
      const prevSidebarScrollTop = this.state.page === 'view' && !shouldResetViewerScroll
        ? ((document.getElementById('viewer-sidebar-scroll') || {}).scrollTop || 0)
        : 0;
      const prevSongSlug = this.state.page === 'view' && this.state.currentSong
        ? String(this.state.currentSong.slug || '')
        : '';
      const shouldPreserveYouTubePanel = !shouldResetViewerScroll
        && !this._forceYoutubeRefresh
        && this.state.page === 'view'
        && !!this.state.currentSong
        && this.state.playingYtIdx !== null;
      const preservedYouTubePanel = shouldPreserveYouTubePanel
        ? document.getElementById('viewer-youtube-panel')
        : null;
      if (preservedYouTubePanel && preservedYouTubePanel.parentNode) {
        preservedYouTubePanel.parentNode.removeChild(preservedYouTubePanel);
      }

      applyAccentColor(this.state.accentColor);
      applyNoteColor(this.state.noteColor);
      document.body.classList.toggle('view-mode-body', this.state.page === 'view');
      document.body.classList.toggle('edit-mode-body', this.state.page === 'edit');
      document.body.classList.toggle('list-mode-body', this.state.page === 'list' || this.state.page === 'setlists' || this.state.page === 'setlist-edit');

      try {
        if (this.state.page === 'edit') {
          this._viewerRerenderInProgress = false;
          this._resetViewerScrollOnNextRender = false;
          app.innerHTML = Editor.render(this.state.editorSong);
          if (typeof applyPersonalChordProViewerTypography === 'function') applyPersonalChordProViewerTypography(app);
          this.syncEditorYouTubeSearchButton();
          return;
        }

        if (this.state.page === 'setlists') {
          this._viewerRerenderInProgress = false;
          this._resetViewerScrollOnNextRender = false;
          app.innerHTML = this.renderSetlistsPage();
          this.syncViewerPaneLayout();
          if (typeof applyPersonalChordProViewerTypography === 'function') applyPersonalChordProViewerTypography(app);
          return;
        }

        if (this.state.page === 'setlist-edit') {
          this._viewerRerenderInProgress = false;
          this._resetViewerScrollOnNextRender = false;
          app.innerHTML = this.renderSetlistEditorPage();
          this.syncViewerPaneLayout();
          if (typeof applyPersonalChordProViewerTypography === 'function') applyPersonalChordProViewerTypography(app);
          return;
        }

        if (this.state.page === 'view' && this.state.currentSetlist && this.state.missingSetlistSong) {
          this._viewerRerenderInProgress = false;
          this._resetViewerScrollOnNextRender = false;
          app.innerHTML = this.renderMissingSetlistSongPage();
          this.syncViewerPaneLayout();
          if (typeof applyPersonalChordProViewerTypography === 'function') applyPersonalChordProViewerTypography(app);
          return;
        }

        if (this.state.page === 'view' && this.state.currentSong) {
          this._viewerRerenderInProgress = true;
          app.innerHTML = Viewer.render(this.state.currentSong);
          if (
            preservedYouTubePanel
            && prevSongSlug
            && prevSongSlug === String(this.state.currentSong.slug || '')
          ) {
            const nextYouTubePanel = document.getElementById('viewer-youtube-panel');
            if (nextYouTubePanel && nextYouTubePanel.parentNode) {
              nextYouTubePanel.parentNode.replaceChild(preservedYouTubePanel, nextYouTubePanel);
            }
          }
          if (typeof applyPersonalChordProViewerTypography === 'function') applyPersonalChordProViewerTypography(app);
          if (typeof Viewer !== 'undefined' && typeof Viewer.afterRender === 'function') {
            window.requestAnimationFrame(function() {
              try {
                Viewer.afterRender({
                  viewerScrollTop: prevViewerScrollTop,
                  sidebarScrollTop: prevSidebarScrollTop
                });
              } catch (err) {
                console.error('Viewer.afterRender failed:', err);
              }
              App.syncViewerPaneLayout();
              App._viewerRerenderInProgress = false;
              App._resetViewerScrollOnNextRender = false;
              App.restoreViewerInputFocusIfNeeded();
            });
          } else {
            this.syncViewerPaneLayout();
            this._viewerRerenderInProgress = false;
            this._resetViewerScrollOnNextRender = false;
            this.restoreViewerInputFocusIfNeeded();
          }
          return;
        }

        this._viewerRerenderInProgress = false;
        this._resetViewerScrollOnNextRender = false;
        app.innerHTML = this.renderListPage();
        this.syncViewerPaneLayout();
        if (typeof applyPersonalChordProViewerTypography === 'function') applyPersonalChordProViewerTypography(app);
        this.restoreListSearchFocusIfNeeded();
      } catch (err) {
        this._viewerRerenderInProgress = false;
        console.error('App.render failed:', err);
        app.innerHTML = '<div class="shell"><div class="status-box error">Render failed: ' + escapeHtml(getStatusMessage(err, 'Unknown error')) + '</div></div>';
      }
    },

        if (!query) return true;
        const haystack = [song.title, song.artist].concat(song.tags || []).join(' ').toLowerCase();

      });
      const songs = matches.slice(0, 20);
      if (!songs.length) return '<div class="empty-state panel">No matching songs.</div>';

        return [
          '<div class="song-item">',
            '<div class="song-meta">',

        ].join('');
      });

        html.push('<div class="setlist-add-more-indicator" aria-hidden="true">… more</div>');

      return html.join('');
